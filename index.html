function fmt$(n,dp=0){if(n==null||isNaN(n))return"—";const s=n<0?"-":"";return s+"$"+Math.abs(n).toLocaleString("en-CA",{maximumFractionDigits:dp,minimumFractionDigits:dp});}
function fmtPct(n,dp=1){if(n==null||isNaN(n))return"—";return(n*100).toFixed(dp)+"%";}

function taxOrdinary(income,prov){
  const t=TAX_BRACKETS_ORDINARY[prov]||TAX_BRACKETS_ORDINARY.Ontario;
  let tax=0; const taxable=Math.max(0,income-REF_2026.federalBPA);
  let rem=taxable, start=0;
  for(const[top,r]of t){const w=top-start;tax+=Math.min(rem,w)*r;rem-=w;if(rem<=0)break;start=top;}
  return Math.max(0,tax);
}
function marginalRate(income,prov){
  const t=TAX_BRACKETS_ORDINARY[prov]||TAX_BRACKETS_ORDINARY.Ontario;
  for(const[top,r]of t){if(income<top)return r;} return t[t.length-1][1];
}
function cppAnnual(pctOfMax,claimAge){
  const baseM=REF_2026.cppMonthlyMaxAt65*Math.max(0,Math.min(1,pctOfMax));
  let adj=0;
  if(claimAge<65)adj=-REF_2026.cppReductionPer_yrEarly*(65-claimAge);
  else if(claimAge>65)adj=REF_2026.cppIncreasePer_yrLate*(claimAge-65);
  return baseM*(1+adj)*12;
}
function oasAnnual(yrs,claimAge){
  const y=Math.min(40,Math.max(0,yrs));
  if(y<10)return 0;
  const baseM=(claimAge>=75?REF_2026.oasMonthlyMax75plus:REF_2026.oasMonthlyMax65to74)*(y/40);
  const adj=claimAge>65?REF_2026.oasIncreasePer_yrLate*(claimAge-65):0;
  return baseM*(1+adj)*12;
}
function oasClawback(netIncome,oasReceived){
  const ex=Math.max(0,netIncome-REF_2026.oasClawbackThreshold);
  return Math.min(oasReceived,ex*0.15);
}

// ==================== AUTH GATE ====================
function AuthGate({children}){
  const [session,setSession]=useState(undefined);
  const [mode,setMode]=useState("signin");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [err,setErr]=useState(""); const [info,setInfo]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:{subscription}}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>subscription.unsubscribe();
  },[]);

  async function submit(e){
    e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try {
      if(mode==="signup"){
        const {error}=await sb.auth.signUp({email,password});
        if(error)throw error;
        setInfo("Check your email to confirm your account, then sign in.");
        setMode("signin");
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
      }
    } catch(e){setErr(e.message||String(e));}
    finally{setBusy(false);}
  }

  if(session===undefined)return<div className="min-h-screen grid place-items-center"><Spinner/></div>;
  if(session)return children(session);

  return(
    <div className="min-h-screen grid place-items-center px-4">
      <div className="w-full max-w-md bg-white rounded-xl shadow-lg border border-slate-200 p-6">
        <Brand/>
        <h2 className="text-lg font-semibold mt-4">{mode==="signup"?"Create your account":"Sign in to Maple Plan"}</h2>
        <p className="text-sm text-slate-500 mt-1">Your financial data is private — encrypted at rest, only you can see it.</p>
        <form onSubmit={submit} className="space-y-3 mt-4">
          <TextInput label="Email" value={email} onChange={setEmail} placeholder="you@example.com"/>
          <label className="block"><span className="text-xs font-medium text-slate-600">Password</span>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6}
              className="mt-1 w-full rounded border-slate-300 border px-2 py-1.5 text-sm focus:ring-red-500 focus:border-red-500"/>
          </label>
          {err&&<div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1.5">{err}</div>}
          {info&&<div className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-1.5">{info}</div>}
          <button disabled={busy} type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded font-medium text-sm disabled:opacity-50">{busy?<Spinner/>:(mode==="signup"?"Create account":"Sign in")}</button>
          <button type="button" onClick={()=>{setMode(mode==="signup"?"signin":"signup");setErr("");setInfo("");}} className="w-full text-xs text-slate-600 hover:text-red-700">{mode==="signup"?"Already have an account? Sign in":"Need an account? Sign up"}</button>
        </form>
        <div className="text-[10px] text-slate-400 mt-4 text-center">Educational platform · Not regulated financial advice</div>
      </div>
    </div>
  );
}

async function loadAll(userId){
  let {data:hh}=await sb.from("households").select("*").eq("user_id",userId).maybeSingle();
  if(!hh){ const {data,error}=await sb.from("households").insert({user_id:userId}).select().single(); if(error)throw error; hh=data; }
  let {data:ppl}=await sb.from("persons").select("*").eq("household_id",hh.id).order("role");
  if(!ppl||ppl.length===0){
    const {data:p1}=await sb.from("persons").insert({household_id:hh.id,role:"primary",first_name:"You",age:55}).select().single();
    ppl=[p1];
  }
  const ids=ppl.map(p=>p.id);
  const {data:accts}=await sb.from("accounts").select("*").in("person_id",ids).order("type");
  const {data:estate}=await sb.from("estate_checklist").select("*").eq("household_id",hh.id);
  const {data:docs}=await sb.from("documents").select("*").eq("household_id",hh.id).order("uploaded_at",{ascending:false});

}

async function uploadDocument(hid,category,file){
  const path=`${hid}/${category}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
  const {error}=await sb.storage.from("documents").upload(path,file,{upsert:false});

function householdTotals(persons,accounts,h){
  const byType={}; let totalAccounts=0,totalTFSA=0,totalNonReg=0,totalDPSP_DCPP=0;
  for(const a of accounts){

    totalAccounts+=Number(a.balance||0);
    if(a.type==="TFSA")totalTFSA+=Number(a.balance||0);
    else if(a.type==="NON_REG")totalNonReg+=Number(a.balance||0);
    else if(a.type==="DPSP"||a.type==="DCPP")totalDPSP_DCPP+=Number(a.balance||0);
  }
  const homeEquity=Math.max(0,Number(h.home_value||0)-Number(h.mortgage_balance||0));
  const assets=totalAccounts+Number(h.emergency_fund||0)+Number(h.home_value||0);
  const debt=Number(h.mortgage_balance||0)+Number(h.other_debt||0);
  const householdIncome=persons.reduce((s,p)=>s+Number(p.income||0),0);
  return{byType,totalAccounts,totalTFSA,totalNonReg,totalDPSP_DCPP,homeEquity,assets,debt,netWorth:assets-debt,householdIncome};
}

function Dashboard({state,setView}){
  const {household,persons,accounts}=state;
  const m=householdTotals(persons,accounts,household);
  const monthlyExp=Number(household.monthly_expenses||0);
  const monthlyIncome=m.householdIncome/12;
  const cashflow=monthlyIncome-monthlyExp;
  const savingsRate=monthlyIncome>0?cashflow/monthlyIncome:0;
  const efMonths=monthlyExp>0?Number(household.emergency_fund||0)/monthlyExp:0;
  const debtToIncome=m.householdIncome>0?m.debt/m.householdIncome:0;
  const primaryAge=persons[0]?.age||55;
  const benchmark=AGE_BENCHMARKS.reduce((b,x)=>Math.abs(x.age-primaryAge)<Math.abs(b.age-primaryAge)?x:b,AGE_BENCHMARKS[0]);
  const benchmarkTarget=benchmark.mult*m.householdIncome;
  const onTrack=benchmarkTarget>0?m.totalAccounts/benchmarkTarget:0;
  const score=Math.max(0,Math.min(20,savingsRate/0.20*20))+Math.max(0,Math.min(15,Math.min(efMonths,6)/6*15))+Math.max(0,Math.min(25,Math.min(onTrack,1.25)/1.25*25))+Math.max(0,Math.min(15,(1-Math.min(debtToIncome,1))*15))+(accounts.length>=3?10:5)+(m.totalTFSA>0?5:0)+(m.totalDPSP_DCPP>0?10:0);
  const tone=score>=75?"good":score>=50?"warn":"bad";
  const allocData=Object.entries(m.byType).map(([t,v])=>({name:ACCOUNT_TYPES[t]?.label||t,value:v,color:ACCOUNT_TYPES[t]?.color||"#64748b"})).filter(d=>d.value>0);
  if(m.homeEquity>0)allocData.push({name:"Home Equity",value:m.homeEquity,color:"#475569"});

  return(
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="Net Worth" value={fmt$(m.netWorth)} sub={`Assets ${fmt$(m.assets)} − Debt ${fmt$(m.debt)}`}/>
        <Stat label="Monthly Cash Flow" value={fmt$(cashflow)} sub={`Savings rate ${fmtPct(savingsRate)}`} tone={cashflow>=0?"good":"bad"}/>
        <Stat label="Emergency Fund" value={efMonths.toFixed(1)+" mo"} sub="Target 3–6 mo" tone={efMonths>=3?"good":efMonths>=1?"warn":"bad"}/>
        <Stat label="Wellness Score" value={Math.round(score)+"/100"} sub={tone==="good"?"On track":tone==="warn"?"Building":"Needs work"} tone={tone}/>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card title={"Allocation — "+accounts.length+" account"+(accounts.length===1?"":"s")+", "+persons.length+(persons.length===1?" person":" people")} className="lg:col-span-2">
          {allocData.length===0?<div className="text-sm text-slate-500 py-12 text-center">No accounts yet. <button onClick={()=>setView("accounts")} className="text-red-600 underline">Add your first account</button>.</div>:
          <div className="h-64"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={allocData} dataKey="value" nameKey="name" cx="40%" cy="50%" outerRadius={90} label={d=>d.name}>{allocData.map((e,i)=><Cell key={i} fill={e.color}/>)}</Pie><Tooltip formatter={v=>fmt$(v)}/><Legend/></PieChart></ResponsiveContainer></div>}
        </Card>
        <Card title="Age-based benchmark">
          <div className="text-sm text-slate-600">At age <strong>{primaryAge}</strong>, target ~<strong>{benchmark.mult}×</strong> household income.</div>
          <div className="mt-3 grid grid-cols-2 gap-2"><Stat label="Target" value={fmt$(benchmarkTarget)}/><Stat label="You have" value={fmt$(m.totalAccounts)} tone={onTrack>=1?"good":onTrack>=0.75?"warn":"bad"}/></div>
          <div className="mt-3 text-xs text-slate-500">On track ratio: <strong>{(onTrack*100).toFixed(0)}%</strong></div>
        </Card>
      </div>
      {Object.keys(m.byType).length>0&&<Card title="Account composition">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
          {Object.entries(m.byType).map(([t,v])=>{const T=ACCOUNT_TYPES[t];if(!T)return null;return<div key={t} className="rounded border border-slate-200 p-2"><div className="text-[10px] uppercase text-slate-500">{T.label}</div><div className="font-bold">{fmt$(v)}</div></div>;})}
        </div>

        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">

function RetirementEngine({state}){
  const {household,persons,accounts}=state;
  const sum=persons.reduce((acc,p)=>{
    const my=accounts.filter(a=>a.person_id===p.id);
    for(const a of my){const bal=Number(a.balance||0),c=Number(a.annual_contribution||0);
      if(["RRSP_1","RRSP_2","SPOUSAL_RRSP","DPSP","DCPP","LIRA","LIF"].includes(a.type)){acc.rrsp+=bal;acc.rrspContrib+=c;}
      else if(a.type==="TFSA"||a.type==="FHSA"){acc.tfsa+=bal;acc.tfsaContrib+=c;}
      else if(a.type==="NON_REG")acc.nonReg+=bal;
    } return acc;
  },{rrsp:0,tfsa:0,nonReg:0,rrspContrib:0,tfsaContrib:0});
  const ret=Number(household.return_rate||0.06);
  const infl=Number(household.inflation||0.025);
  const retireAge=Number(household.retirement_age||65);
  const endAge=Number(household.end_age||95);
  const primary=persons[0]||{age:55};
  const cppIncome=persons.reduce((s,p)=>s+cppAnnual(p.cpp_pct_of_max||0,p.cpp_start_age||65),0);
  const oasIncome=persons.reduce((s,p)=>s+oasAnnual(p.years_in_canada||35,p.oas_start_age||65),0);
  const otherPensions=persons.reduce((s,p)=>s+Number(p.other_pension_annual||0),0);
  const rows=[];
  let rrsp=sum.rrsp,tfsa=sum.tfsa,nonReg=sum.nonReg;
  let cumulativeShortfall=0;
  for(let age=primary.age;age<=endAge;age++){
    const yrs=age-primary.age;
    const inflFactor=Math.pow(1+infl,yrs);
    const yearSpending=Number(household.monthly_expenses||5000)*12*inflFactor;
    const govCpp=persons.every(p=>age>=(p.cpp_start_age||65))?cppIncome*inflFactor:0;
    const govOas=persons.every(p=>age>=(p.oas_start_age||65))?oasIncome*inflFactor:0;
    const govIn=govCpp+govOas+otherPensions*inflFactor;
    if(age<retireAge){
      rrsp=rrsp*(1+ret)+sum.rrspContrib; tfsa=tfsa*(1+ret)+sum.tfsaContrib; nonReg=nonReg*(1+ret);
      rows.push({age,phase:"accum",rrsp:Math.round(rrsp),tfsa:Math.round(tfsa),nonReg:Math.round(nonReg),total:Math.round(rrsp+tfsa+nonReg),gov:0,withdrawal:0,spending:Math.round(yearSpending),shortfall:0});
      continue;
    }
    let need=yearSpending, rrifMin=0;
    if(age>=72&&rrsp>0) rrifMin=rrsp*(RRIF_MIN[Math.min(95,age)]||0.2);
    const fromGov=Math.min(govIn,need); need-=fromGov;
    let fromRRSP=Math.max(rrifMin,Math.min(rrsp,need)); rrsp-=fromRRSP; need-=fromRRSP*0.75;
    let fromNonReg=Math.min(nonReg,Math.max(0,need)); nonReg-=fromNonReg; need-=fromNonReg;
    let fromTFSA=Math.min(tfsa,Math.max(0,need)); tfsa-=fromTFSA; need-=fromTFSA;
    if(need>0) cumulativeShortfall+=need;
    rrsp=Math.max(0,rrsp)*(1+ret); tfsa=Math.max(0,tfsa)*(1+ret); nonReg=Math.max(0,nonReg)*(1+ret);
    rows.push({age,phase:"retire",rrsp:Math.round(rrsp),tfsa:Math.round(tfsa),nonReg:Math.round(nonReg),total:Math.round(rrsp+tfsa+nonReg),gov:Math.round(govIn),withdrawal:Math.round(fromRRSP+fromNonReg+fromTFSA),spending:Math.round(yearSpending),shortfall:Math.round(Math.max(0,need)),rrifMin:Math.round(rrifMin)});
  }
  const neverDepletes=cumulativeShortfall===0;
  const grossNetAtRetire=cppIncome+oasIncome+otherPensions+(Number(household.monthly_expenses||0)*12)*0.5;
  const clawback=oasClawback(grossNetAtRetire,oasIncome);
  return(
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="CPP household" value={fmt$(cppIncome)} sub="Combined across people"/>
        <Stat label="OAS household" value={fmt$(oasIncome)} sub="At chosen start ages"/>
        <Stat label="Est. OAS clawback" value={fmt$(clawback)} tone={clawback>0?"warn":"good"}/>
        <Stat label="Verdict" value={neverDepletes?"✓ On track":"⚠ Shortfall"} sub={neverDepletes?"Plan to "+endAge:"Gap "+fmt$(cumulativeShortfall)} tone={neverDepletes?"good":"bad"}/>
      </div>
      <Card title="Portfolio projection by year (nominal $)">
        {rows.length===0?<div className="text-sm text-slate-500">Set ages and accounts first.</div>:
        <div className="h-72"><ResponsiveContainer width="100%" height="100%">
          <AreaChart data={rows}>
            <CartesianGrid strokeDasharray="3 3"/>
            <XAxis dataKey="age"/>
            <YAxis tickFormatter={v=>"$"+(v/1000).toFixed(0)+"K"}/>
            <Tooltip formatter={v=>fmt$(v)}/><Legend/>
            <Area type="monotone" dataKey="rrsp" stackId="1" stroke="#dc2626" fill="#fecaca" name="Tax-deferred"/>
            <Area type="monotone" dataKey="nonReg" stackId="1" stroke="#65a30d" fill="#d9f99d" name="Non-Reg"/>
            <Area type="monotone" dataKey="tfsa" stackId="1" stroke="#0891b2" fill="#a5f3fc" name="TFSA + FHSA"/>
            <ReferenceLine x={retireAge} stroke="#475569" strokeDasharray="3 3" label={{value:"Retire",position:"top",fill:"#475569",fontSize:11}}/>
          </AreaChart>
        </ResponsiveContainer></div>}
      </Card>
      <Card title="Year-by-year drawdown">
        <div className="overflow-x-auto"><table className="w-full text-xs">
          <thead className="bg-slate-100 text-slate-600"><tr>{["Age","Phase","Spend","Gov't","RRIF min","Withdrawal","Tax-def","TFSA","Non-Reg","Total","Shortfall"].map(h=><th key={h} className="text-right px-2 py-1.5 first:text-left">{h}</th>)}</tr></thead>
          <tbody>{rows.filter(r=>r.age>=retireAge-1).map(r=>(
            <tr key={r.age} className="border-t border-slate-100">
              <td className="px-2 py-1">{r.age}</td>
              <td className="px-2 py-1 text-right"><Pill tone={r.phase==="retire"?"blue":"slate"}>{r.phase}</Pill></td>
              <td className="px-2 py-1 text-right">{fmt$(r.spending)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.gov)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.rrifMin||0)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.withdrawal)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.rrsp)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.tfsa)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.nonReg)}</td>
              <td className="px-2 py-1 text-right font-semibold">{fmt$(r.total)}</td>
              <td className="px-2 py-1 text-right">{r.shortfall>0?<span className="text-red-600">{fmt$(r.shortfall)}</span>:"—"}</td>
            </tr>))}</tbody>
        </table></div>
        <SourceTag src="CRA RRIF schedule; Service Canada CPP/OAS; mined Calm Money Coach workbooks" date="2026" jur="Federal" conf="High"/>
      </Card>
    </div>
  );
}

function TaxCentre({state}){
  const {household,persons}=state;
  const [income,setIncome]=useState(persons[0]?.income||80000);
  const [capGain,setCapGain]=useState(0);
  const prov=household.province||"Ontario";
  const ordTax=taxOrdinary(income,prov);
  const margRate=marginalRate(income,prov);
  const cgTax=capGain*REF_2026.capGainsInclusion*margRate;
  const total=ordTax+cgTax, ti=income+capGain, at=ti-total;
  return(
    <div className="space-y-4">
      <Card title={"2026 tax estimator — "+prov}>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <NumInput label="Ordinary income" value={income} onChange={setIncome}/>
          <NumInput label="Capital gains" value={capGain} onChange={setCapGain}/>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mt-4">
          <Stat label="Total income" value={fmt$(ti)}/>
          <Stat label="Total tax" value={fmt$(total)} tone="warn"/>
          <Stat label="After-tax" value={fmt$(at)} tone="good"/>
          <Stat label="Marginal" value={fmtPct(margRate)}/>
          <Stat label="Average" value={fmtPct(ti>0?total/ti:0)}/>
        </div>
        <SourceTag src="2026 combined federal+provincial brackets from mined Calm Money Coach RRSP calculator" date="2026" jur={prov} conf="High"/>
      </Card>
      <Card title="2026 key amounts">
        <table className="w-full text-sm"><tbody>
          <tr className="border-b border-slate-100"><td className="py-1.5">RRSP dollar limit</td><td className="text-right font-medium">{fmt$(REF_2026.rrspDollarLimit)}</td></tr>
          <tr className="border-b border-slate-100"><td className="py-1.5">TFSA annual / cumulative</td><td className="text-right font-medium">{fmt$(REF_2026.tfsaAnnualLimit)} / {fmt$(REF_2026.tfsaCumulativeFromAge18)}</td></tr>
          <tr className="border-b border-slate-100"><td className="py-1.5">FHSA annual / lifetime</td><td className="text-right font-medium">{fmt$(REF_2026.fhsaAnnualLimit)} / {fmt$(REF_2026.fhsaLifetimeLimit)}</td></tr>
          <tr className="border-b border-slate-100"><td className="py-1.5">Federal BPA</td><td className="text-right font-medium">{fmt$(REF_2026.federalBPA)}</td></tr>
          <tr className="border-b border-slate-100"><td className="py-1.5">OAS clawback threshold</td><td className="text-right font-medium">{fmt$(REF_2026.oasClawbackThreshold)}</td></tr>
          <tr className="border-b border-slate-100"><td className="py-1.5">CPP max monthly @ 65</td><td className="text-right font-medium">{fmt$(REF_2026.cppMonthlyMaxAt65,2)}</td></tr>
          <tr><td className="py-1.5">Capital-gains inclusion</td><td className="text-right font-medium">{fmtPct(REF_2026.capGainsInclusion,0)}</td></tr>
        </tbody></table>
        <SourceTag src="CRA & Service Canada — 2026 indexed amounts" date="Jan 2026" jur="Federal" conf="High"/>
      </Card>
    </div>
  );
}

function AICoach(){return(<Card title="AI financial coach (demo)" right={<Pill tone="amber">Cited canned responses</Pill>}><div className="text-sm text-slate-600">In production this wires to retrieval-augmented Claude API calls over indexed CRA / Service Canada / FCAC documents, with per-chunk source attribution. For now, the Retirement and Tax Centre tabs answer numeric questions interactively.</div></Card>);}

function SourcesPanel(){
  const items=[["Canada Revenue Agency","https://www.canada.ca/en/revenue-agency.html"],["Service Canada","https://www.canada.ca/en/services/benefits.html"],["FCAC","https://www.canada.ca/en/financial-consumer-agency.html"],["StatsCan","https://www.statcan.gc.ca"],["OSFI","https://www.osfi-bsif.gc.ca"],["Canadian Securities Administrators","https://www.securities-administrators.ca"],["FSRA (Ontario pensions)","https://www.fsrao.ca"],["MPAC (Ontario assessment)","https://www.mpac.ca"]];
  return<Card title="Authoritative Canadian sources"><ul className="divide-y divide-slate-100">{items.map(([n,u])=><li key={u} className="py-1.5 flex justify-between gap-2 flex-wrap"><span className="text-sm">{n}</span><a href={u} target="_blank" rel="noreferrer" className="text-xs text-sky-700 underline">{u}</a></li>)}</ul></Card>;
}

// ==================== ROOT ====================
function AppShell({session}){
  const userId=session.user.id;
  const [state,setState]=useState(null);
  const [view,setView]=useState("dashboard");
  const [loadErr,setLoadErr]=useState("");
  const refresh=useCallback(async()=>{
    try{const s=await loadAll(userId); setState(s);}
    catch(e){setLoadErr(e.message||String(e));}
  },[userId]);
  useEffect(()=>{refresh();},[refresh]);

  const tabs=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"profile",icon:"👫",label:"Household"},
    {id:"accounts",icon:"💼",label:"Accounts"},
    {id:"retire",icon:"🏖️",label:"Retirement"},
    {id:"tax",icon:"🧾",label:"Tax Centre"},
    {id:"estate",icon:"📜",label:"Estate & Docs"},
    {id:"coach",icon:"💬",label:"AI Coach"},
    {id:"sources",icon:"📚",label:"Sources"},
  ];
  async function signOut(){await sb.auth.signOut();}

  if(loadErr)return<div className="p-8 text-sm text-red-700 bg-red-50 max-w-xl mx-auto mt-12 rounded">Load error: {loadErr}<br/><button onClick={refresh} className="mt-2 underline">Retry</button></div>;
  if(!state)return<div className="min-h-screen grid place-items-center"><Spinner/></div>;

  return(
    <div>
      <Disclaimer/>
      <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4 flex-wrap">
          <Brand/>
          <div className="flex items-center gap-3 text-xs">
            <span className="text-slate-500"><span className="pulse-dot inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>{session.user.email}</span>
            <button onClick={signOut} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">Sign out</button>
          </div>
        </div>
        <nav className="max-w-7xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto scroll-shadow">
          {tabs.map(t=><Tab key={t.id} {...t} active={view===t.id} onClick={()=>setView(t.id)}/>)}
        </nav>
      </header>
      <main className="max-w-7xl mx-auto p-4">
        {view==="dashboard"&&<Dashboard state={state} setView={setView}/>}
        {view==="profile"  &&<HouseholdPanel state={state} refresh={refresh}/>}
        {view==="accounts" &&<AccountsPanel state={state} refresh={refresh}/>}
        {view==="retire"   &&<RetirementEngine state={state}/>}
        {view==="tax"      &&<TaxCentre state={state}/>}
        {view==="estate"   &&<EstatePanel state={state} refresh={refresh}/>}
        {view==="coach"    &&<AICoach/>}
        {view==="sources"  &&<SourcesPanel/>}
      </main>
      <footer className="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-500 border-t border-slate-200 mt-6">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div>Maple Plan • Educational planning support • {new Date().toLocaleDateString("en-CA")}</div>
          <div>Data effective Jan 2026 • Stored in Supabase ca-central-1</div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate>{session=><AppShell session={session}/>}</AuthGate>);
</script>
</body>
</html>
