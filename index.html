// ============================================================
// CALCULATION HELPERS
// ============================================================
function fmt$(n, dp=0){
  if (n === null || n === undefined || isNaN(n)) return "—";
  const sign = n<0 ? "-" : "";
  const v = Math.abs(n);
  return sign + "$" + v.toLocaleString("en-CA",{maximumFractionDigits:dp, minimumFractionDigits:dp});
}
function fmtPct(n, dp=1){
  if (n===null||n===undefined||isNaN(n)) return "—";
  return (n*100).toFixed(dp) + "%";
}

// Compute federal+provincial tax on ordinary income (combined marginal bracket method).
// These are *combined effective top-of-bracket rates* — exact tax = sum over filled brackets.
function taxOrdinary(income, prov){
  const t = TAX_BRACKETS_ORDINARY[prov] || TAX_BRACKETS_ORDINARY.Ontario;
  let tax = 0, prev = REF_2026.federalBPA; // approximation: BPA reduces taxable
  const taxable = Math.max(0, income - REF_2026.federalBPA);
  let remaining = taxable;
  let bracketStart = 0;
  for (const [top, rate] of t){
    const bracketWidth = top - bracketStart;
    const tax_in_bracket = Math.min(remaining, bracketWidth) * rate;
    tax += tax_in_bracket;
    remaining -= bracketWidth;
    if (remaining <= 0) break;
    bracketStart = top;
  }
  return Math.max(0, tax);
}
function marginalRate(income, prov){
  const t = TAX_BRACKETS_ORDINARY[prov] || TAX_BRACKETS_ORDINARY.Ontario;
  for (const [top, rate] of t){ if (income < top) return rate; }
  return t[t.length-1][1];
}

// CPP estimate: simplified. Real CPP uses earnings history + drop-out. We model:
// pct of max (0..1) × max benefit at 65, then apply early/late adjustment.
function cppAnnual(pctOfMax, claimAge){
  const baseMonthly = REF_2026.cppMonthlyMaxAt65 * Math.max(0, Math.min(1, pctOfMax));
  let adj = 0;
  if (claimAge < 65) adj = -REF_2026.cppReductionPer_yrEarly * (65 - claimAge);
  else if (claimAge > 65) adj = REF_2026.cppIncreasePer_yrLate * (claimAge - 65);
  return baseMonthly * (1 + adj) * 12;
}
// OAS: full at 65 if 40+ yrs in Canada after 18; pro-rated by yrs/40 (min 10 to start).
// Late-claim bonus up to 70.
function oasAnnual(yearsInCanada, claimAge, currentAge){
  const yrs = Math.min(40, Math.max(0, yearsInCanada));
  if (yrs < 10) return 0;
  const baseMonthly = (claimAge>=75?REF_2026.oasMonthlyMax75plus:REF_2026.oasMonthlyMax65to74) * (yrs/40);
  let adj = 0;
  if (claimAge > 65) adj = REF_2026.oasIncreasePer_yrLate * (claimAge - 65);
  return baseMonthly * (1 + adj) * 12;
}
// OAS clawback (recovery tax): 15% × (net income − threshold)
function oasClawback(netIncome, oasReceived){
  const excess = Math.max(0, netIncome - REF_2026.oasClawbackThreshold);
  return Math.min(oasReceived, excess * 0.15);
}

// Project a portfolio with annual contribution & return
function projectPortfolio(start, annualContrib, returnRate, years){
  const series = []; let bal = start;
  for (let y=0; y<=years; y++){
    series.push({year:y, balance: Math.round(bal)});
    bal = bal * (1+returnRate) + annualContrib;
  }
  return series;
}

// Year-by-year retirement income/withdrawal simulator
function simulateRetirement(opts){
  const {currentAge, retireAge, endAge, currentRRSP, currentTFSA, currentNonReg,
         annualContribRRSP, annualContribTFSA, returnRate, inflation,
         spending, cppAnnualAmt, oasAnnualAmt, otherPension, cppStartAge, oasStartAge, prov} = opts;
  let rrsp = currentRRSP, tfsa = currentTFSA, nonReg = currentNonReg;
  const rows = [];
  let cumulativeShortfall = 0;
  for (let age = currentAge; age <= endAge; age++){
    const yrsFromNow = age - currentAge;
    const inflFactor = Math.pow(1+inflation, yrsFromNow);
    const yearSpending = spending * inflFactor;
    let cppIn = age >= cppStartAge ? cppAnnualAmt * inflFactor : 0;
    let oasIn = age >= oasStartAge ? oasAnnualAmt * inflFactor : 0;
    let pensionIn = otherPension * inflFactor;
    // Accumulation phase
    if (age < retireAge){
      rrsp = rrsp*(1+returnRate) + annualContribRRSP;
      tfsa = tfsa*(1+returnRate) + annualContribTFSA;
      nonReg = nonReg*(1+returnRate);
      rows.push({age, phase:"accum", rrsp:Math.round(rrsp), tfsa:Math.round(tfsa), nonReg:Math.round(nonReg),
                 total:Math.round(rrsp+tfsa+nonReg), gov:0, withdrawal:0, spending:Math.round(yearSpending),
                 shortfall:0});
      continue;
    }
    // Drawdown phase: government income first, then RRSP/RRIF (taxable), then non-reg, then TFSA
    const govNet = cppIn + oasIn + pensionIn;
    let need = yearSpending; // pre-tax spending target
    let withdrawal = 0;
    // Apply RRIF minimum if applicable
    let rrifMin = 0;
    if (age >= 72 && rrsp > 0){
      const minPct = RRIF_MIN[Math.min(95,age)] || 0.2;
      rrifMin = rrsp * minPct;
    }
    const fromGov = Math.min(govNet, need);
    need -= fromGov;
    let fromRRSP = Math.max(rrifMin, Math.min(rrsp, need));
    rrsp -= fromRRSP; need -= fromRRSP * 0.75; // ~25% withholding/tax buffer
    let fromNonReg = Math.min(nonReg, Math.max(0,need));
    nonReg -= fromNonReg; need -= fromNonReg;
    let fromTFSA = Math.min(tfsa, Math.max(0,need));
    tfsa -= fromTFSA; need -= fromTFSA;
    withdrawal = fromRRSP + fromNonReg + fromTFSA;
    if (need > 0) cumulativeShortfall += need;
    // Apply growth on remaining balances
    rrsp = Math.max(0,rrsp)*(1+returnRate);
    tfsa = Math.max(0,tfsa)*(1+returnRate);
    nonReg = Math.max(0,nonReg)*(1+returnRate);
    rows.push({age, phase:"retire", rrsp:Math.round(rrsp), tfsa:Math.round(tfsa), nonReg:Math.round(nonReg),
               total:Math.round(rrsp+tfsa+nonReg), gov:Math.round(govNet), withdrawal:Math.round(withdrawal),
               spending:Math.round(yearSpending), shortfall:Math.round(Math.max(0,need)), rrifMin:Math.round(rrifMin)});
  }
  return {rows, cumulativeShortfall:Math.round(cumulativeShortfall), neverDepletes: cumulativeShortfall===0};
}

function Dashboard({p, setView}){
  const assets = p.rrsp + p.tfsa + p.nonReg + p.fhsa + p.resp + p.homeValue + p.emergencyFund;
  const liab = p.mortgageBalance + p.otherDebt;
  const netWorth = assets - liab;
  const liquidInvest = p.rrsp + p.tfsa + p.nonReg + p.fhsa;
  const monthlyIncome = p.income/12 + p.spousalIncome/12;
  const cashflow = monthlyIncome - p.monthlyExpenses;
  const savingsRate = monthlyIncome>0 ? cashflow/monthlyIncome : 0;
  const efMonths = p.monthlyExpenses>0 ? p.emergencyFund / p.monthlyExpenses : 0;
  const debtToIncome = (p.income+p.spousalIncome)>0 ? liab/(p.income+p.spousalIncome) : 0;
  const benchmark = AGE_BENCHMARKS.reduce((b,x)=> Math.abs(x.age-p.age)<Math.abs(b.age-p.age)?x:b, AGE_BENCHMARKS[0]);
  const benchmarkTarget = benchmark.mult * (p.income+p.spousalIncome);
  const onTrack = liquidInvest / benchmarkTarget;

  // Wellness score (0-100)
  const score =
    Math.max(0,Math.min(20, savingsRate/0.20 * 20)) +
    Math.max(0,Math.min(15, Math.min(efMonths,6)/6 * 15)) +
    Math.max(0,Math.min(25, Math.min(onTrack,1.25)/1.25 * 25)) +
    Math.max(0,Math.min(15, (1-Math.min(debtToIncome,1)) * 15)) +
    (p.hasWill?5:0) + (p.hasPOA?5:0) + (p.hasInsurance?10:0) +
    (p.tfsa>=REF_2026.tfsaAnnualLimit?5:0);

  const allocData = [

        <Stat label="Wellness Score" value={Math.round(score)+"/100"} sub={tone==="good"?"On track":tone==="warn"?"Building":"Needs work"} tone={tone}/>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        <Card title="Asset Allocation" className="lg:col-span-2">
          <div className="h-64">
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={allocData} dataKey="value" nameKey="name" cx="40%" cy="50%" outerRadius={90} label={d=>d.name}>
                  {allocData.map((e,i)=> <Cell key={i} fill={e.color}/>)}
                </Pie>
                <Tooltip formatter={(v)=>fmt$(v)}/>
                <Legend/>
              </PieChart>
            </ResponsiveContainer>
          </div>
          <SourceTag src="User entries on Profile" date="2026" jur="—" conf="High"/>
        </Card>

        <Card title="Age-Based Benchmark">
          <div className="text-sm text-slate-600">At age <strong>{p.age}</strong>, target investment savings is roughly
            <strong> {benchmark.mult}× </strong> household income.</div>
          <div className="mt-3 grid grid-cols-2 gap-2">
            <Stat label="Target" value={fmt$(benchmarkTarget)} tone="default"/>
            <Stat label="Where you are" value={fmt$(liquidInvest)} tone={onTrack>=1?"good":onTrack>=0.75?"warn":"bad"}/>
          </div>
          <div className="mt-3 text-xs text-slate-500">
            On track ratio: <strong>{(onTrack*100).toFixed(0)}%</strong>
          </div>
          <SourceTag src="Mined from retirement_calculator_ontrack.xlsx (age-based multiples)" date="2026" jur="Canada" conf="Medium"/>
        </Card>
      </div>

      <Card title="Quick actions">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">

}

function HealthAssessment({p, setP}){
  const checks = [
    {ok: (p.emergencyFund / (p.monthlyExpenses||1)) >= 3,
     label:"Emergency fund covers 3+ months of expenses",
     action:"Open a high-interest savings account and automate weekly transfers until you reach 3 months of essential expenses."},
    {ok: p.monthlyExpenses < (p.income/12 + p.spousalIncome/12) * 0.8,
     label:"Monthly expenses < 80% of household income",
     action:"Review subscriptions, housing, and discretionary categories. The 50/30/20 rule is a useful starting frame."},
    {ok: p.tfsa > 0 || p.rrsp > 0,
     label:"Using at least one registered account (TFSA/RRSP/FHSA)",
     action:"TFSA is the default for most Canadians; RRSP makes sense above the ~$58K bracket; FHSA if you may buy a first home."},
    {ok: p.otherDebt < p.income * 0.20,
     label:"Non-mortgage debt < 20% of annual income",
     action:"Prioritize high-interest debt (credit card > LOC). Avalanche (highest rate first) usually wins mathematically."},
    {ok: p.mortgageBalance < p.homeValue * 0.80,
     label:"Mortgage < 80% loan-to-value on primary residence",
     action:"At <80% LTV you avoid CMHC default insurance for renewals and have refinancing flexibility."},
    {ok: p.hasWill,
     label:"Have a current will",
     action:"Without a will, the province's intestacy rules decide. Update after marriage, divorce, kids, or major asset changes."},
    {ok: p.hasPOA,
     label:"Have powers of attorney (property & personal care)",
     action:"In every province, two separate POAs are recommended: one for finances, one for healthcare decisions."},
    {ok: p.hasInsurance,
     label:"Life/disability/critical-illness insurance reviewed in last 3 years",
     action:"If anyone depends on your income, term life is usually the cheapest baseline; disability is the most under-bought."},
    {ok: p.cppPctOfMax >= 0.6,

     action:"Check your Service Canada Statement of Contributions to see your actual CPP entitlement."},
    {ok: (p.rrsp + p.tfsa + p.nonReg) >= (p.income+p.spousalIncome) * 2,

    <div className="space-y-4">

              <span className={"mt-0.5 inline-flex w-5 h-5 rounded-full grid place-items-center text-xs font-bold " +
                (c.ok ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700")}>{c.ok?"✓":"!"}</span>
              <div className="flex-1">
                <div className="text-sm font-medium">{c.label}</div>
                {!c.ok && <div className="text-xs text-slate-500 mt-0.5">{c.action}</div>}
              </div>
            </li>
          ))}
        </ul>
        <SourceTag src="Composite from FCAC Financial Wellness indicators + Calm Money Coach planner" date="2026" jur="Canada" conf="Medium"/>
      </Card>

      <Card title="Estate-readiness quick toggles">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">

function RetirementEngine({p, setP}){
  const set = (k)=>(v)=>setP({...p,[k]:v});
  const cppAnnualAmt = useMemo(()=> cppAnnual(p.cppPctOfMax, p.cppStartAge), [p.cppPctOfMax,p.cppStartAge]);
  const oasAnnualAmt = useMemo(()=> oasAnnual(p.yearsInCanada, p.oasStartAge, p.age), [p.yearsInCanada,p.oasStartAge,p.age]);

  const sim = useMemo(()=> simulateRetirement({
    currentAge:p.age, retireAge:p.retireAge, endAge:p.endAge,
    currentRRSP:p.rrsp, currentTFSA:p.tfsa, currentNonReg:p.nonReg,
    annualContribRRSP:p.annualSavingsRRSP, annualContribTFSA:p.annualSavingsTFSA,
    returnRate:p.return, inflation:p.inflation,
    spending:p.monthlyExpenses*12,
    cppAnnualAmt, oasAnnualAmt, otherPension:p.otherPension,
    cppStartAge:p.cppStartAge, oasStartAge:p.oasStartAge, prov:p.province,
  }), [p, cppAnnualAmt, oasAnnualAmt]);

  // Sensitivity: portfolio at retirement at 5%, 6%, 7%
  const scenarios = [REF_2026.returnConservative, REF_2026.returnModerate, REF_2026.returnAggressive].map(r=>{
    const s = simulateRetirement({...{
      currentAge:p.age, retireAge:p.retireAge, endAge:p.endAge,
      currentRRSP:p.rrsp, currentTFSA:p.tfsa, currentNonReg:p.nonReg,
      annualContribRRSP:p.annualSavingsRRSP, annualContribTFSA:p.annualSavingsTFSA,
      returnRate:r, inflation:p.inflation,
      spending:p.monthlyExpenses*12,
      cppAnnualAmt, oasAnnualAmt, otherPension:p.otherPension,
      cppStartAge:p.cppStartAge, oasStartAge:p.oasStartAge, prov:p.province,
    }});
    const atRetire = s.rows.find(x=>x.age===p.retireAge) || s.rows[0];
    const atEnd = s.rows[s.rows.length-1];
    return {rate:r, portfolioAtRetire:atRetire.total, portfolioAtEnd:atEnd.total, neverDepletes:s.neverDepletes};
  });

  const verdict = sim.neverDepletes ? "ON TRACK — never depletes" : `SHORTFALL — cumulative ${fmt$(sim.cumulativeShortfall)}`;

  // CPP timing comparison
  const cppTiming = [60,65,70].map(a=>({
    age:a, annual: cppAnnual(p.cppPctOfMax, a), lifetime20: cppAnnual(p.cppPctOfMax, a)*20,
  }));

  // OAS clawback
  const grossNetIncomeAtRetire = (cppAnnualAmt + oasAnnualAmt + p.otherPension + (p.monthlyExpenses*12)*0.6);
  const clawback = oasClawback(grossNetIncomeAtRetire, oasAnnualAmt);

  return (
    <div className="space-y-4">
      <Card title="Retirement assumptions">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <NumInput label="CPP % of max" value={Math.round(p.cppPctOfMax*100)} onChange={v=>set("cppPctOfMax")(v/100)} prefix="" step={5} suffix="%" help="Check Service Canada Statement of Contributions"/>
          <SelectInput label="CPP start age" value={p.cppStartAge} onChange={v=>set("cppStartAge")(Number(v))}
            options={[60,61,62,63,64,65,66,67,68,69,70].map(a=>({value:a,label:String(a)}))}/>
          <NumInput label="Years in Canada (after 18)" value={p.yearsInCanada} onChange={set("yearsInCanada")} prefix="" step={1}/>
          <SelectInput label="OAS start age" value={p.oasStartAge} onChange={v=>set("oasStartAge")(Number(v))}
            options={[65,66,67,68,69,70].map(a=>({value:a,label:String(a)}))}/>
          <NumInput label="Expected return" value={Math.round(p.return*1000)/10} onChange={v=>set("return")(v/100)} prefix="" step={0.5} suffix="%/yr"/>
          <NumInput label="Inflation" value={Math.round(p.inflation*1000)/10} onChange={v=>set("inflation")(v/100)} prefix="" step={0.25} suffix="%/yr"/>
        </div>
      </Card>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="CPP @ start age" value={fmt$(cppAnnualAmt)} sub={`Monthly: ${fmt$(cppAnnualAmt/12)}`}/>
        <Stat label="OAS @ start age" value={fmt$(oasAnnualAmt)} sub={`Monthly: ${fmt$(oasAnnualAmt/12)}`}/>
        <Stat label="Est. OAS clawback" value={fmt$(clawback)} sub={`Threshold: ${fmt$(REF_2026.oasClawbackThreshold)}`} tone={clawback>0?"warn":"good"}/>
        <Stat label="Verdict" value={sim.neverDepletes?"✓ On track":"⚠ Shortfall"} sub={verdict} tone={sim.neverDepletes?"good":"bad"}/>
      </div>

      <Card title="Portfolio projection by year (real $)">
        <div className="h-72">
          <ResponsiveContainer width="100%" height="100%">
            <AreaChart data={sim.rows}>
              <CartesianGrid strokeDasharray="3 3" />
              <XAxis dataKey="age" />
              <YAxis tickFormatter={v=>"$"+(v/1000).toFixed(0)+"K"} />
              <Tooltip formatter={(v)=>fmt$(v)}/>
              <Legend/>
              <Area type="monotone" dataKey="rrsp" stackId="1" stroke="#dc2626" fill="#fecaca" name="RRSP/RRIF"/>
              <Area type="monotone" dataKey="nonReg" stackId="1" stroke="#65a30d" fill="#d9f99d" name="Non-Reg"/>
              <Area type="monotone" dataKey="tfsa" stackId="1" stroke="#0891b2" fill="#a5f3fc" name="TFSA"/>
              <ReferenceLine x={p.retireAge} stroke="#475569" strokeDasharray="3 3" label={{value:"Retire",position:"top",fill:"#475569",fontSize:11}}/>
            </AreaChart>
          </ResponsiveContainer>
        </div>
        <SourceTag src="Withdrawal sequencing logic mined from Calm Money Coach early-retirement workbook" date="2026" jur="Canada" conf="Medium"/>
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card title="Scenarios — return sensitivity">
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-500"><tr><th className="text-left py-1">Return</th><th className="text-right">@ Retire</th><th className="text-right">@ Plan end</th><th className="text-right">Depletes?</th></tr></thead>
            <tbody>
              {scenarios.map((s,i)=>(
                <tr key={i} className="border-t border-slate-100">
                  <td className="py-1.5">{fmtPct(s.rate)}</td>
                  <td className="text-right">{fmt$(s.portfolioAtRetire)}</td>
                  <td className="text-right">{fmt$(s.portfolioAtEnd)}</td>
                  <td className="text-right">{s.neverDepletes?<Pill tone="green">No</Pill>:<Pill tone="red">Yes</Pill>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>

        <Card title="When should I claim CPP?">
          <table className="w-full text-sm">
            <thead className="text-xs text-slate-500"><tr><th className="text-left py-1">Start age</th><th className="text-right">Annual</th><th className="text-right">20-yr nominal</th></tr></thead>
            <tbody>
              {cppTiming.map(r=>(
                <tr key={r.age} className="border-t border-slate-100">
                  <td className="py-1.5">{r.age} {r.age===60&&<Pill tone="red">−36%</Pill>} {r.age===70&&<Pill tone="green">+42%</Pill>}</td>
                  <td className="text-right">{fmt$(r.annual)}</td>
                  <td className="text-right">{fmt$(r.lifetime20)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="text-xs text-slate-500 mt-2">Break-even between 65 and 70 is around age <strong>~81</strong>. Health, family longevity, and need for income now should all factor in.</div>
          <SourceTag src="Service Canada CPP timing rules; 0.6%/mo early, 0.7%/mo late" date="2026" jur="Federal" conf="High"/>
        </Card>
      </div>

      <Card title="RRIF minimum withdrawals by age (Income Tax Act schedule)">
        <div className="grid grid-cols-4 md:grid-cols-8 gap-2 text-xs">
          {Object.entries(RRIF_MIN).filter(([a])=>Number(a)>=70 && Number(a)<=95 && Number(a)%2===0).map(([a,r])=>(
            <div key={a} className="bg-slate-50 rounded px-2 py-1">
              <div className="font-medium">Age {a}</div>
              <div className="text-slate-600">{(r*100).toFixed(2)}%</div>
            </div>
          ))}
        </div>
        <SourceTag src="CRA — RRIF minimum withdrawal factors, Income Tax Regulation 7308" date="2026" jur="Federal" conf="High"/>
      </Card>

      <Card title="Year-by-year drawdown plan">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead className="bg-slate-100 text-slate-600"><tr>
              {["Age","Phase","Spend","Gov't","RRIF min","Withdrawal","RRSP","TFSA","Non-Reg","Total","Shortfall"].map(h=><th key={h} className="text-right px-2 py-1.5 first:text-left">{h}</th>)}
            </tr></thead>
            <tbody>
              {sim.rows.filter(r=>r.age>=p.retireAge-1).map(r=>(
                <tr key={r.age} className="border-t border-slate-100">
                  <td className="px-2 py-1">{r.age}</td>
                  <td className="px-2 py-1 text-right"><Pill tone={r.phase==="retire"?"blue":"slate"}>{r.phase}</Pill></td>
                  <td className="px-2 py-1 text-right">{fmt$(r.spending)}</td>

                  <td className="px-2 py-1 text-right">{r.shortfall>0 ? <span className="text-red-600">{fmt$(r.shortfall)}</span> : "—"}</td>

      <Card title="Safe withdrawal rates by retirement age">
        <table className="w-full text-sm">

function TaxCentre({p, setP}){
  const set = (k)=>(v)=>setP({...p,[k]:v});
  const [income, setIncome] = useState(p.income);
  const [capGain, setCapGain] = useState(0);
  const [eligDiv, setEligDiv] = useState(0);
  const ordTax = taxOrdinary(income, p.province);
  const margRate = marginalRate(income, p.province);
  const cgTax = capGain * REF_2026.capGainsInclusion * margRate;
  const divRate = (TAX_BRACKETS_ELIG_DIV[p.province] || TAX_BRACKETS_ELIG_DIV.Ontario)
                  .find(([t])=>income<t)?.[1] ?? 0.40;
  const divTax = eligDiv * Math.max(0,divRate);
  const totalTax = ordTax + cgTax + divTax;
  const totalIncome = income + capGain + eligDiv;
  const afterTax = totalIncome - totalTax;
  const avgRate = totalIncome>0 ? totalTax/totalIncome : 0;

  // RRSP-deduction impact
  const [rrspDeduct, setRrspDeduct] = useState(10000);
  const taxAtIncome = taxOrdinary(income, p.province);
  const taxAfterRRSP = taxOrdinary(Math.max(0,income-rrspDeduct), p.province);
  const rrspSaving = taxAtIncome - taxAfterRRSP;

  const brackets = TAX_BRACKETS_ORDINARY[p.province];

  return (
    <div className="space-y-4">
      <Card title="2026 tax estimator (federal + provincial combined)">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <SelectInput label="Province" value={p.province} onChange={set("province")}
            options={Object.keys(TAX_BRACKETS_ORDINARY).map(k=>({value:k,label:k}))}/>
          <NumInput label="Employment / pension income" value={income} onChange={setIncome}/>
          <NumInput label="Realized capital gains" value={capGain} onChange={setCapGain}/>
          <NumInput label="Eligible Canadian dividends" value={eligDiv} onChange={setEligDiv}/>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mt-4">
          <Stat label="Total income" value={fmt$(totalIncome)}/>
          <Stat label="Total tax" value={fmt$(totalTax)} tone="warn"/>
          <Stat label="After-tax" value={fmt$(afterTax)} tone="good"/>
          <Stat label="Marginal rate" value={fmtPct(margRate)}/>
          <Stat label="Average rate" value={fmtPct(avgRate)}/>
        </div>
        <SourceTag src="2026 combined federal+provincial brackets mined from Calm Money Coach RRSP calculator" date="2026" jur={p.province} conf="High"/>
      </Card>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <Card title="RRSP contribution — tax reduction">

function AICoach({p}){
  const [msgs, setMsgs] = useState([
    {role:"assistant", text:"Hi — I'm your educational financial coach. I can explain Canadian concepts in plain English, walk through any calculation in this app step-by-step, and suggest planning ideas. I always cite the rule and source. Pick a suggestion or type a question."}
  ]);
  const [input, setInput] = useState("");
  const ref = useRef(null);
  useEffect(()=>{ if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [msgs]);

  // Canned, deterministic "RAG" responses keyed to common questions.
  // In a production build this routes to a server with retrieval over CRA/Service Canada/FCAC corpora.
  function answer(q){
    const Q = q.toLowerCase();
    if (Q.includes("cpp")) return {
      text: `CPP at 65 (Jan 2026 max) is $${REF_2026.cppMonthlyMaxAt65}/mo (~$${(REF_2026.cppMonthlyMaxAt65*12).toLocaleString()}/yr). Taking it early at 60 reduces it by 7.2% per year (36% total). Taking it late at 70 increases it by 8.4% per year (42% total). Break-even between starting at 65 vs 70 is roughly age 81. Your estimated entitlement depends on your contribution history — check your Statement of Contributions in your My Service Canada Account.`,
      source: "Service Canada — Canadian Retirement Income Calculator & CPP rules",
    };
    if (Q.includes("oas")) return {
      text: `OAS (Jan-Mar 2026 max age 65-74) is $${REF_2026.oasMonthlyMax65to74}/mo, $${REF_2026.oasMonthlyMax75plus}/mo at 75+. You need 40 years of Canadian residence after age 18 for full OAS; less is pro-rated (minimum 10 years to start). OAS is clawed back at 15% on net income above $${REF_2026.oasClawbackThreshold.toLocaleString()}, fully gone around $155K for ages 65-74.`,
      source: "Service Canada — OAS pension overview & recovery tax",
    };
    if (Q.includes("rrsp") && Q.includes("tfsa")) return {
      text: "Rule of thumb: TFSA first if your current marginal rate is below your expected retirement rate (and for emergency-fund-adjacent savings). RRSP first if you're in the top brackets today and expect to be in lower brackets in retirement. FHSA combines RRSP-style deduction with TFSA-style tax-free withdrawal — best-of-both if you may buy a first home in the next 15 years.",
      source: "FCAC — Choosing between TFSA, RRSP, FHSA",
    };
    if (Q.includes("rrif")) return {
      text: `By December 31 of the year you turn 71 you must convert your RRSP to a RRIF (or annuity). RRIF minimum withdrawals start the year after conversion: 5.28% at 71, 5.40% at 72, 6.82% at 80, 8.51% at 85, hitting 20% at 95+. You always control where the money goes — only the minimum withdrawal is forced (and taxable as ordinary income).`,
      source: "Income Tax Regulations s. 7308; CRA RRIF guide",
    };
    if (Q.includes("widow") || Q.includes("survivor")) return {
      text: "The 'widow's penalty' is the tax shock when a couple drops to one survivor: same household incomes are now taxed in single-person brackets, no pension-income splitting, and CPP survivor benefits are capped at the combined CPP maximum. Mitigation: hold more in TFSA, draw down RRSP earlier in retirement, consider permanent life insurance for liquidity, and use spousal RRSPs while both are alive to even out future incomes.",
      source: "Calm Money Coach widow's-penalty workbook; CRA — pension income splitting",
    };
    if (Q.includes("gis")) return {
      text: `GIS (Guaranteed Income Supplement) tops up OAS for low-income seniors. Jan-Mar 2026 single max is $${REF_2026.gisMaxSingleMonthly}/mo, fully phased out around $${REF_2026.gisIncomeCutoffSingle.toLocaleString()} of other income. GIS is non-taxable but income-tested — every $1 of RRSP/RRIF withdrawal in early retirement can claw back GIS at 50–75%. For low-income seniors, draw down RRSP *before* age 65 if possible.`,
      source: "Service Canada — GIS eligibility & rates",
    };
    if (Q.includes("tax") && Q.includes("bracket")) {
      const r = TAX_BRACKETS_ORDINARY[p.province];
      const top = r[r.length-1][1];
      return {text: `${p.province} 2026 combined top marginal rate is ${(top*100).toFixed(2)}%. The federal basic personal amount ($${REF_2026.federalBPA.toLocaleString()}) effectively means tax starts above that. Capital gains are taxed at 50% inclusion — your marginal capital-gains rate is half your ordinary rate.`,
        source: "2026 federal + provincial combined brackets"};
    }
    return {text: "I haven't been wired up to that question yet. In the production build, this is a retrieval-augmented call to indexed CRA, Service Canada and FCAC documents with citations. For now, the Retirement Engine and Tax Centre tabs answer most numerical questions interactively.", source:"—"};
  }

  function send(text){
    const t = (text??input).trim(); if (!t) return;
    const a = answer(t);
    setMsgs(m=>[...m, {role:"user", text:t}, {role:"assistant", text:a.text, source:a.source}]);
    setInput("");
  }
  const suggestions = [
    "Explain CPP timing.",
    "Should I use RRSP or TFSA first?",
    "What is the OAS clawback?",
    "How do RRIF minimums work?",
    "What's the widow's penalty?",
    "Do I qualify for GIS?",
  ];

  return (
    <Card title="AI financial coach (educational demo)" right={<Pill tone="amber">Demo — wired to canned RAG responses</Pill>}>
      <div ref={ref} className="h-72 overflow-y-auto bg-slate-50 rounded p-3 space-y-2 text-sm">
        {msgs.map((m,i)=>(
          <div key={i} className={"flex " + (m.role==="user"?"justify-end":"justify-start")}>
            <div className={"max-w-[80%] rounded-lg px-3 py-2 " + (m.role==="user"?"bg-red-600 text-white":"bg-white border border-slate-200")}>
              <div>{m.text}</div>
              {m.source && <div className="text-[10px] mt-1 opacity-70 citation">Source: {m.source}</div>}
            </div>
          </div>
        ))}
      </div>
      <div className="mt-3 flex flex-wrap gap-2">
        {suggestions.map(s=> <button key={s} onClick={()=>send(s)} className="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">{s}</button>)}
      </div>
      <div className="mt-2 flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Ask about RRSP, CPP, OAS, RRIF, tax brackets…"
          className="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-red-500 focus:border-red-500"/>
        <button onClick={()=>send()} className="bg-red-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-red-700">Send</button>
      </div>
      <div className="text-[10px] text-slate-400 mt-2">
        Production design: server-side RAG over indexed CRA / Service Canada / FCAC / provincial securities / pension authority documents, with effective-date tracking and confidence scoring per chunk. Every assistant turn cites source URL, jurisdiction, and as-of date.
      </div>
    </Card>
  );
}
