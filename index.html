function fmt$(n,dp=0){if(n==null||isNaN(n))return"—";const s=n<0?"-":"";return s+"$"+Math.abs(n).toLocaleString("en-CA",{maximumFractionDigits:dp,minimumFractionDigits:dp});}

function taxOrdinary(income,prov){
  const t=TAX_BRACKETS_ORDINARY[prov]||TAX_BRACKETS_ORDINARY.Ontario;
  let tax=0; const taxable=Math.max(0,income-REF_2026.federalBPA);
  let rem=taxable, start=0;
  for(const[top,r]of t){const w=top-start;tax+=Math.min(rem,w)*r;rem-=w;if(rem<=0)break;start=top;}
  return Math.max(0,tax);
}
function marginalRate(income,prov){
  const t=TAX_BRACKETS_ORDINARY[prov]||TAX_BRACKETS_ORDINARY.Ontario;
  for(const[top,r]of t){if(income<top)return r;} return t[t.length-1][1];
}
function cppAnnual(pctOfMax,claimAge){
  const baseM=REF_2026.cppMonthlyMaxAt65*Math.max(0,Math.min(1,pctOfMax));
  let adj=0;
  if(claimAge<65)adj=-REF_2026.cppReductionPer_yrEarly*(65-claimAge);
  else if(claimAge>65)adj=REF_2026.cppIncreasePer_yrLate*(claimAge-65);
  return baseM*(1+adj)*12;
}
function oasAnnual(yrs,claimAge){
  const y=Math.min(40,Math.max(0,yrs));
  if(y<10)return 0;
  const baseM=(claimAge>=75?REF_2026.oasMonthlyMax75plus:REF_2026.oasMonthlyMax65to74)*(y/40);
  const adj=claimAge>65?REF_2026.oasIncreasePer_yrLate*(claimAge-65):0;
  return baseM*(1+adj)*12;
}
function oasClawback(netIncome,oasReceived){
  const ex=Math.max(0,netIncome-REF_2026.oasClawbackThreshold);
  return Math.min(oasReceived,ex*0.15);
}

// Mortgage payment → monthly equivalent
function monthlyMortgagePayment(mortgages){
  return (mortgages||[]).reduce((sum,m)=>{
    const freq = PAYMENT_FREQUENCIES[m.payment_frequency] || PAYMENT_FREQUENCIES.monthly;
    return sum + (Number(m.payment_amount||0) * freq.perYear / 12);
  }, 0);
}
function totalMortgageBalance(mortgages, fallback){
  if (!mortgages || mortgages.length===0) return Number(fallback||0);
  return mortgages.reduce((s,m)=>s+Number(m.current_balance||0), 0);
}

// Year mortgage is fully paid off (age of primary). Returns null if not modelable.
function mortgageEndAgeForPrimary(mortgages, primaryAgeNow){
  if (!mortgages || mortgages.length===0) return null;
  let maxEnd = null;
  for (const m of mortgages){
    if (m.amortization_end_date){
      const end = new Date(m.amortization_end_date);
      const today = new Date();
      const yearsAway = (end.getTime() - today.getTime()) / (365.25*24*3600*1000);
      const ageAtEnd = Math.round(primaryAgeNow + yearsAway);
      if (maxEnd===null || ageAtEnd>maxEnd) maxEnd = ageAtEnd;
    } else if (m.maturity_date){
      // If we only have term maturity, use that as a proxy (conservative).
      const end = new Date(m.maturity_date);
      const today = new Date();
      const yearsAway = (end.getTime() - today.getTime()) / (365.25*24*3600*1000);
      const ageAtEnd = Math.round(primaryAgeNow + yearsAway);
      if (maxEnd===null || ageAtEnd>maxEnd) maxEnd = ageAtEnd;
    }
  }
  return maxEnd;
}

// Compute monthly expenses for a given life phase.
// phases: 'working' | 'retired_with_mortgage' | 'retired_no_mortgage'
function monthlyExpensesForPhase(household, mortgages, phase){
  const ess = Number(household.monthly_expenses_essential||0);
  const dis = Number(household.monthly_expenses_discretionary||0);
  const work = Number(household.monthly_expenses_work_related||0);
  const factor = Number(household.retirement_lifestyle_factor||0.80);
  const mort = monthlyMortgagePayment(mortgages);
  // legacy fallback if user hasn't filled in the new fields
  const legacy = Number(household.monthly_expenses||0);
  const useLegacy = (ess+dis+work)===0 && legacy>0;
  if (useLegacy){
    if (phase==='retired_no_mortgage') return Math.max(0, legacy*factor - mort);
    if (phase==='retired_with_mortgage') return legacy*factor;
    return legacy + mort; // working: legacy already represents total, but we add mortgage if it's tracked separately. Backwards-compat caveat.
  }
  if (phase==='working') return ess + dis + work + mort;
  if (phase==='retired_with_mortgage') return (ess + dis)*factor + mort;
  if (phase==='retired_no_mortgage') return (ess + dis)*factor;
  return 0;
}

// ==================== CSV parsing + Monarch analysis ====================
function parseCSV(text){
  const rows=[]; let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c=text[i];
    if(inQuotes){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i+=2; continue; }
      if(c==='"'){ inQuotes=false; i++; continue; }
      field+=c; i++;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      field+=c; i++;
    }
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  if(rows.length===0) return {headers:[], rows:[]};
  const headers=rows[0].map(h=>h.trim());
  const dataRows=rows.slice(1).filter(r=>r.length===headers.length && r.some(x=>x!==''));
  const objects=dataRows.map(r=>Object.fromEntries(headers.map((h,idx)=>[h, r[idx]])));
  return {headers, rows:objects};
}

  if (!accountLabel) return null;
  const m = accountLabel.match(/\(\.{2,}([0-9A-Za-z]+)\)/);

function analyzeMonarchTransactions(rows){
  const accounts = new Map();   // label -> count
  const categories = new Map(); // category -> count
  const owners = new Map();
  let minDate=null, maxDate=null;
  for (const r of rows){
    accounts.set(r.Account||"(none)", (accounts.get(r.Account||"(none)")||0)+1);
    categories.set(r.Category||"(none)", (categories.get(r.Category||"(none)")||0)+1);
    owners.set(r.Owner||"(none)", (owners.get(r.Owner||"(none)")||0)+1);
    if (r.Date){
      if (!minDate || r.Date<minDate) minDate=r.Date;
      if (!maxDate || r.Date>maxDate) maxDate=r.Date;
    }
  }
  // 12-month window ending at maxDate
  const end = maxDate || new Date().toISOString().slice(0,10);
  const endD = new Date(end);
  const startD = new Date(endD); startD.setFullYear(endD.getFullYear()-1);
  const start = startD.toISOString().slice(0,10);
  const recent = rows.filter(r=> r.Date >= start && r.Date <= end);

  const outByCat = new Map(), inByCat = new Map();
  for (const r of recent){
    const amt = Number(r.Amount||0);
    const cat = r.Category||"(uncategorized)";
    if (amt<0) outByCat.set(cat, (outByCat.get(cat)||0) + (-amt));
    else inByCat.set(cat, (inByCat.get(cat)||0) + amt);
  }
  // Bucket totals (annual, derived from last 12 months)
  const bucketAnnual = {essential:0, discretionary:0, work_related:0, transfer:0, income:0, uncategorized:0};
  for (const [cat, amt] of outByCat){
    bucketAnnual[bucketFor(cat)] += amt;
  }
  const monthly = {
    essential: bucketAnnual.essential/12,
    discretionary: bucketAnnual.discretionary/12,
    work_related: bucketAnnual.work_related/12,
    uncategorized: bucketAnnual.uncategorized/12,
  };
  // Top categories sorted
  const topOut = Array.from(outByCat.entries()).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([c,v])=>({category:c,annual:v,monthly:v/12,bucket:bucketFor(c)}));
  return {
    nRows: rows.length, minDate, maxDate, nRecent: recent.length,
    accounts: Array.from(accounts.entries()).sort((a,b)=>b[1]-a[1]),
    categories: Array.from(categories.entries()).sort((a,b)=>b[1]-a[1]),
    owners: Array.from(owners.entries()),
    totalOutflow12mo: Array.from(outByCat.values()).reduce((s,v)=>s+v,0),
    totalInflow12mo: Array.from(inByCat.values()).reduce((s,v)=>s+v,0),
    bucketAnnual, monthly, topOut,
    windowStart: start, windowEnd: end,
  };
}

async function importMonarchTransactions(householdId, filename, rows){
  // 1. Create import_run
  const {data:run, error:runErr} = await sb.from("import_runs").insert({
    household_id: householdId, filename, source: "monarch",
    rows_imported: 0,
  }).select().single();
  if (runErr) throw runErr;

  // 2. Map rows → transaction inserts
  const txns = rows.map(r=>{
    const amount = Number(r.Amount||0);
    const cat = r.Category||"";
    return {
      household_id: householdId, import_run_id: run.id,
      date: r.Date || null, merchant: r.Merchant||null, category: cat||null,
      account_label: r.Account||null, account_mask: extractMask(r.Account),
      original_statement: r["Original Statement"]||null, notes: r.Notes||null,
      amount: amount, tags: r.Tags ? [r.Tags] : null, owner: r.Owner||null,
      is_transfer: MONARCH_BUCKETS.transfer.has(cat),
      source: "monarch",
    };
  }).filter(t=>t.date);

  // 3. Insert in chunks of 500
  let inserted = 0;
  const CHUNK = 500;
  for (let i=0; i<txns.length; i+=CHUNK){
    const chunk = txns.slice(i, i+CHUNK);
    const {error} = await sb.from("transactions").insert(chunk);
    if (error) throw error;
    inserted += chunk.length;
  }

  // 4. Update import_run with results
  const dates = txns.map(t=>t.date).sort();
  await sb.from("import_runs").update({
    rows_imported: inserted,
    rows_skipped: rows.length - inserted,
    date_range_start: dates[0],
    date_range_end: dates[dates.length-1],
  }).eq("id", run.id);

  return {runId: run.id, inserted, skipped: rows.length - inserted};
}

function AuthGate({children}){
  const [session,setSession]=useState(undefined);
  const [mode,setMode]=useState("signin");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [err,setErr]=useState(""); const [info,setInfo]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:{subscription}}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>subscription.unsubscribe();
  },[]);

  async function submit(e){
    e.preventDefault(); setErr(""); setInfo(""); setBusy(true);
    try {
      if(mode==="signup"){
        const {error}=await sb.auth.signUp({email,password});
        if(error)throw error;
        setInfo("Account created — signing you in.");
      } else {
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
      }
    } catch(e){setErr(e.message||String(e));}
    finally{setBusy(false);}
  }

  if(session===undefined)return<div className="min-h-screen grid place-items-center"><Spinner/></div>;
  if(session)return children(session);

  return(
    <div className="min-h-screen grid place-items-center px-4">

          <TextInput label="Email" value={email} onChange={setEmail} placeholder="you@example.com"/>
          <label className="block"><span className="text-xs font-medium text-slate-600">Password</span>

              className="mt-1 w-full rounded border-slate-300 border px-2 py-1.5 text-sm focus:ring-red-500 focus:border-red-500"/>
          </label>
          {err&&<div className="text-xs text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1.5">{err}</div>}
          {info&&<div className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-2 py-1.5">{info}</div>}
          <button disabled={busy} type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded font-medium text-sm disabled:opacity-50">{busy?<Spinner/>:(mode==="signup"?"Create account":"Sign in")}</button>

        </form>
        <div className="text-[10px] text-slate-400 mt-4 text-center">Educational platform · Not regulated financial advice</div>
      </div>
    </div>
  );
}

function householdTotals(persons,accounts,h,mortgages){
  const byType={}; let totalAccounts=0,totalTFSA=0,totalNonReg=0,totalDPSP_DCPP=0;
  for(const a of accounts){
    byType[a.type]=(byType[a.type]||0)+Number(a.balance||0);
    totalAccounts+=Number(a.balance||0);
    if(a.type==="TFSA")totalTFSA+=Number(a.balance||0);
    else if(a.type==="NON_REG")totalNonReg+=Number(a.balance||0);
    else if(a.type==="DPSP"||a.type==="DCPP")totalDPSP_DCPP+=Number(a.balance||0);
  }
  const mortgageDebt = totalMortgageBalance(mortgages, h.mortgage_balance);
  const homeEquity=Math.max(0,Number(h.home_value||0)-mortgageDebt);
  const assets=totalAccounts+Number(h.emergency_fund||0)+Number(h.home_value||0);
  const debt=mortgageDebt+Number(h.other_debt||0);
  const householdIncome=persons.reduce((s,p)=>s+Number(p.income||0),0);
  return{byType,totalAccounts,totalTFSA,totalNonReg,totalDPSP_DCPP,homeEquity,assets,debt,netWorth:assets-debt,householdIncome,mortgageDebt};
}

// ==================== Donut chart with side legend (fixes label bunching) ====================
function AssetDonut({data}){
  const total = data.reduce((s,d)=>s+d.value, 0);
  const renderPctLabel = ({percent, x, y}) => {
    if (percent < 0.08) return null;
    return <text x={x} y={y} fill="#fff" textAnchor="middle" dominantBaseline="central" fontSize={11} fontWeight={600}>{(percent*100).toFixed(0)}%</text>;
  };
  return (
    <div className="flex flex-col md:flex-row gap-3 items-center">
      <div className="w-full md:w-1/2 h-56 relative">
        <ResponsiveContainer width="100%" height="100%">
          <PieChart>
            <Pie data={data} dataKey="value" nameKey="name" cx="50%" cy="50%" innerRadius={50} outerRadius={90} labelLine={false} label={renderPctLabel}>
              {data.map((e,i)=><Cell key={i} fill={e.color}/>)}
            </Pie>
            <Tooltip formatter={(v,n)=>[fmt$(v), n]}/>
          </PieChart>
        </ResponsiveContainer>
        <div className="absolute inset-0 grid place-items-center pointer-events-none">
          <div className="text-center">
            <div className="text-[10px] uppercase text-slate-400">Total</div>
            <div className="font-bold text-slate-700">{fmt$(total)}</div>
          </div>
        </div>
      </div>
      <ul className="w-full md:w-1/2 space-y-1.5 text-sm">
        {data.map((d,i)=>{
          const pct = total>0 ? d.value/total : 0;
          return (
            <li key={i} className="flex items-center justify-between gap-2">
              <span className="flex items-center gap-2 min-w-0">
                <span className="w-3 h-3 rounded-sm shrink-0" style={{background:d.color}}/>
                <span className="truncate">{d.name}</span>
              </span>
              <span className="text-slate-600 text-xs whitespace-nowrap">{fmt$(d.value)} <span className="text-slate-400">· {(pct*100).toFixed(0)}%</span></span>
            </li>
          );
        })}
      </ul>
    </div>
  );
}

function ExpensePhasesExplainer({state}){
  const {household, persons, mortgages} = state;
  const primaryAge = persons[0]?.age || 55;
  const retireAge = Number(household.retirement_age || 65);
  const mortEndAge = mortgageEndAgeForPrimary(mortgages, primaryAge);
  const working = monthlyExpensesForPhase(household, mortgages, 'working');
  const retiredWithM = monthlyExpensesForPhase(household, mortgages, 'retired_with_mortgage');
  const retiredNoM = monthlyExpensesForPhase(household, mortgages, 'retired_no_mortgage');
  const work = Number(household.monthly_expenses_work_related||0);
  const mort = monthlyMortgagePayment(mortgages);
  const factor = Number(household.retirement_lifestyle_factor||0.80);

  const phases = [
    {label:"Working", ageRange:`Now (age ${primaryAge}) → ${retireAge}`, monthly:working, color:"#dc2626"},
    ...(mortEndAge!==null && mortEndAge > retireAge
      ? [{label:"Retired, still paying mortgage", ageRange:`${retireAge} → ${mortEndAge}`, monthly:retiredWithM, color:"#f59e0b"}]
      : []),
    {label: mortEndAge!==null
        ? (mortEndAge > retireAge ? "Retired, mortgage paid off" : "Retired (mortgage already paid)")
        : "Retired",
      ageRange:`${mortEndAge!==null && mortEndAge>retireAge ? mortEndAge : retireAge} → end of plan`,
      monthly: mortEndAge===null ? retiredWithM : retiredNoM,
      color:"#10b981"},
  ];

  return (
    <Card title="What happens to your expenses across retirement?">
      <div className="text-sm text-slate-600 mb-3">
        Your expenses aren't a single number for life — they shift as work-related costs disappear, the mortgage gets paid off, and you adjust your lifestyle in retirement. Here's the breakdown the planner uses, based on your inputs in the <strong>Household</strong> and <strong>Mortgages</strong> tabs.
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
        {phases.map((p,i)=>(
          <div key={i} className="rounded-lg border border-slate-200 p-3" style={{borderLeftWidth:4, borderLeftColor:p.color}}>
            <div className="text-xs uppercase tracking-wide text-slate-500">{p.label}</div>
            <div className="text-[11px] text-slate-400">{p.ageRange}</div>
            <div className="font-bold text-xl mt-1">{fmt$(p.monthly,0)}<span className="text-xs font-normal text-slate-500">/mo</span></div>
            <div className="text-[11px] text-slate-500 mt-1">{fmt$(p.monthly*12,0)}/yr</div>
          </div>
        ))}
      </div>
      <div className="mt-4 text-xs text-slate-600 space-y-1">
        <div><strong>Why working-years expenses are highest:</strong> they include essential + discretionary + work-related (commute, lunches, work clothes, daycare) + mortgage payment.</div>
        {mort>0 && <div><strong>When the mortgage ends</strong> (around age {mortEndAge}), your monthly burden drops by <strong>{fmt$(mort,0)}/mo</strong> — that's the single biggest cliff in most household budgets.</div>}
        {work>0 && <div><strong>When you retire</strong>, work-related costs of <strong>{fmt$(work,0)}/mo</strong> disappear, and your essential + discretionary spending typically drops to about <strong>{Math.round(factor*100)}%</strong> of your working level (less commuting, fewer professional clothes, more home cooking, but possibly higher healthcare and travel — adjust the factor on the Household tab).</div>}
        {mort===0 && work===0 && (Number(household.monthly_expenses_essential||0)+Number(household.monthly_expenses_discretionary||0))===0 && <div className="text-amber-700">Tip: Fill in your monthly expense buckets on the Household tab (and add a mortgage on the Mortgages tab) to see this breakdown.</div>}
      </div>
      <SourceTag src="Industry rule of thumb: retirement spending typically 70–85% of pre-retirement (varies widely); StatsCan Household Spending data" date="2026" jur="Canada" conf="Medium"/>
    </Card>
  );
}

function RetirementEngine({state}){
  const {household,persons,accounts,mortgages}=state;
  const sum=persons.reduce((acc,p)=>{
    const my=accounts.filter(a=>a.person_id===p.id);
    for(const a of my){const bal=Number(a.balance||0),c=Number(a.annual_contribution||0);
      if(["RRSP_1","RRSP_2","SPOUSAL_RRSP","DPSP","DCPP","LIRA","LIF"].includes(a.type)){acc.rrsp+=bal;acc.rrspContrib+=c;}
      else if(a.type==="TFSA"||a.type==="FHSA"){acc.tfsa+=bal;acc.tfsaContrib+=c;}
      else if(a.type==="NON_REG")acc.nonReg+=bal;
    } return acc;
  },{rrsp:0,tfsa:0,nonReg:0,rrspContrib:0,tfsaContrib:0});
  const ret=Number(household.return_rate||0.06);
  const infl=Number(household.inflation||0.025);
  const retireAge=Number(household.retirement_age||65);
  const endAge=Number(household.end_age||95);
  const primary=persons[0]||{age:55};
  const mortEndAge = mortgageEndAgeForPrimary(mortgages, primary.age);
  const cppIncome=persons.reduce((s,p)=>s+cppAnnual(p.cpp_pct_of_max||0,p.cpp_start_age||65),0);
  const oasIncome=persons.reduce((s,p)=>s+oasAnnual(p.years_in_canada||35,p.oas_start_age||65),0);
  const otherPensions=persons.reduce((s,p)=>s+Number(p.other_pension_annual||0),0);
  const rows=[];
  let rrsp=sum.rrsp,tfsa=sum.tfsa,nonReg=sum.nonReg;
  let cumulativeShortfall=0;
  for(let age=primary.age;age<=endAge;age++){
    const yrs=age-primary.age;
    const inflFactor=Math.pow(1+infl,yrs);
    // Phase-aware spending
    let phaseSpending;
    if (age < retireAge) phaseSpending = monthlyExpensesForPhase(household, mortgages, 'working')*12;
    else if (mortEndAge!==null && age < mortEndAge) phaseSpending = monthlyExpensesForPhase(household, mortgages, 'retired_with_mortgage')*12;
    else phaseSpending = monthlyExpensesForPhase(household, mortgages, mortEndAge===null ? 'retired_with_mortgage' : 'retired_no_mortgage')*12;
    const yearSpending = phaseSpending * inflFactor;
    const govCpp=persons.every(p=>age>=(p.cpp_start_age||65))?cppIncome*inflFactor:0;
    const govOas=persons.every(p=>age>=(p.oas_start_age||65))?oasIncome*inflFactor:0;
    const govIn=govCpp+govOas+otherPensions*inflFactor;
    if(age<retireAge){
      rrsp=rrsp*(1+ret)+sum.rrspContrib; tfsa=tfsa*(1+ret)+sum.tfsaContrib; nonReg=nonReg*(1+ret);
      rows.push({age,phase:"accum",rrsp:Math.round(rrsp),tfsa:Math.round(tfsa),nonReg:Math.round(nonReg),total:Math.round(rrsp+tfsa+nonReg),gov:0,withdrawal:0,spending:Math.round(yearSpending),shortfall:0});
      continue;
    }
    let need=yearSpending, rrifMin=0;
    if(age>=72&&rrsp>0) rrifMin=rrsp*(RRIF_MIN[Math.min(95,age)]||0.2);
    const fromGov=Math.min(govIn,need); need-=fromGov;
    let fromRRSP=Math.max(rrifMin,Math.min(rrsp,need)); rrsp-=fromRRSP; need-=fromRRSP*0.75;
    let fromNonReg=Math.min(nonReg,Math.max(0,need)); nonReg-=fromNonReg; need-=fromNonReg;
    let fromTFSA=Math.min(tfsa,Math.max(0,need)); tfsa-=fromTFSA; need-=fromTFSA;
    if(need>0) cumulativeShortfall+=need;
    rrsp=Math.max(0,rrsp)*(1+ret); tfsa=Math.max(0,tfsa)*(1+ret); nonReg=Math.max(0,nonReg)*(1+ret);
    rows.push({age,phase:"retire",rrsp:Math.round(rrsp),tfsa:Math.round(tfsa),nonReg:Math.round(nonReg),total:Math.round(rrsp+tfsa+nonReg),gov:Math.round(govIn),withdrawal:Math.round(fromRRSP+fromNonReg+fromTFSA),spending:Math.round(yearSpending),shortfall:Math.round(Math.max(0,need)),rrifMin:Math.round(rrifMin)});
  }
  const neverDepletes=cumulativeShortfall===0;
  const grossNetAtRetire=cppIncome+oasIncome+otherPensions+(Number(household.monthly_expenses_essential||0)*12)*0.5;
  const clawback=oasClawback(grossNetAtRetire,oasIncome);
  return(
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="CPP household" value={fmt$(cppIncome)} sub="Combined across people"/>
        <Stat label="OAS household" value={fmt$(oasIncome)} sub="At chosen start ages"/>
        <Stat label="Est. OAS clawback" value={fmt$(clawback)} tone={clawback>0?"warn":"good"}/>
        <Stat label="Verdict" value={neverDepletes?"✓ On track":"⚠ Shortfall"} sub={neverDepletes?"Plan to "+endAge:"Gap "+fmt$(cumulativeShortfall)} tone={neverDepletes?"good":"bad"}/>
      </div>

      <ExpensePhasesExplainer state={state}/>

      <Card title="Portfolio + spending projection (nominal $)">
        {rows.length===0?<div className="text-sm text-slate-500">Set ages and accounts first.</div>:
        <div className="h-80"><ResponsiveContainer width="100%" height="100%">
          <AreaChart data={rows}>
            <CartesianGrid strokeDasharray="3 3"/>
            <XAxis dataKey="age"/>
            <YAxis yAxisId="left" tickFormatter={v=>"$"+(v/1000).toFixed(0)+"K"}/>
            <YAxis yAxisId="right" orientation="right" tickFormatter={v=>"$"+(v/1000).toFixed(0)+"K"}/>
            <Tooltip formatter={v=>fmt$(v)}/><Legend/>
            <Area yAxisId="left" type="monotone" dataKey="rrsp" stackId="1" stroke="#dc2626" fill="#fecaca" name="Tax-deferred"/>
            <Area yAxisId="left" type="monotone" dataKey="nonReg" stackId="1" stroke="#65a30d" fill="#d9f99d" name="Non-Reg"/>
            <Area yAxisId="left" type="monotone" dataKey="tfsa" stackId="1" stroke="#0891b2" fill="#a5f3fc" name="TFSA + FHSA"/>
            <Line yAxisId="right" type="stepAfter" dataKey="spending" stroke="#7c2d12" strokeWidth={2} dot={false} name="Annual spending"/>
            <ReferenceLine yAxisId="left" x={retireAge} stroke="#475569" strokeDasharray="3 3" label={{value:"Retire",position:"top",fill:"#475569",fontSize:11}}/>
            {mortEndAge!==null && mortEndAge>=primary.age && mortEndAge<=endAge && <ReferenceLine yAxisId="left" x={mortEndAge} stroke="#10b981" strokeDasharray="3 3" label={{value:"Mortgage paid",position:"top",fill:"#10b981",fontSize:11}}/>}
          </AreaChart>
        </ResponsiveContainer></div>}
        <div className="text-[11px] text-slate-500 mt-2">Spending line steps down at retirement (work-related expenses disappear, lifestyle factor applied) and again when the mortgage finishes.</div>
      </Card>

      <Card title="Year-by-year drawdown">
        <div className="overflow-x-auto"><table className="w-full text-xs">
          <thead className="bg-slate-100 text-slate-600"><tr>{["Age","Phase","Spend","Gov't","RRIF min","Withdrawal","Tax-def","TFSA","Non-Reg","Total","Shortfall"].map(h=><th key={h} className="text-right px-2 py-1.5 first:text-left">{h}</th>)}</tr></thead>
          <tbody>{rows.filter(r=>r.age>=retireAge-1).map(r=>(
            <tr key={r.age} className="border-t border-slate-100">
              <td className="px-2 py-1">{r.age}</td>
              <td className="px-2 py-1 text-right"><Pill tone={r.phase==="retire"?"blue":"slate"}>{r.phase}</Pill></td>
              <td className="px-2 py-1 text-right">{fmt$(r.spending)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.gov)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.rrifMin||0)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.withdrawal)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.rrsp)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.tfsa)}</td>
              <td className="px-2 py-1 text-right">{fmt$(r.nonReg)}</td>

              <td className="px-2 py-1 text-right">{r.shortfall>0?<span className="text-red-600">{fmt$(r.shortfall)}</span>:"—"}</td>
            </tr>))}</tbody>
        </table></div>
        <SourceTag src="CRA RRIF schedule; Service Canada CPP/OAS; mined Calm Money Coach workbooks" date="2026" jur="Federal" conf="High"/>
      </Card>

}

function ImportPanel({state, refresh}){
  const {household} = state;
  const [file, setFile] = useState(null);
  const [parsed, setParsed] = useState(null);
  const [analysis, setAnalysis] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [recent, setRecent] = useState([]);
  const [applyingExp, setApplyingExp] = useState(false);
  const [applyMsg, setApplyMsg] = useState("");
  const busyRef = useRef(false);     // synchronous guard against double-clicks
  const applyRef = useRef(false);

  useEffect(()=>{
    sb.from("import_runs").select("*").eq("household_id", household.id).order("created_at",{ascending:false}).limit(10).then(({data})=>setRecent(data||[]));
  }, [household.id, result]);

  async function handleFile(f){
    setFile(f); setErr(""); setParsed(null); setAnalysis(null); setResult(null);
    if (!f) return;
    if (f.size > 30*1024*1024){ setErr("File too large (max 30 MB)."); return; }
    try {
      const text = await f.text();
      const p = parseCSV(text);
      const required = ["Date","Merchant","Category","Account","Amount"];
      const missing = required.filter(c => !p.headers.includes(c));
      if (missing.length){
        setErr("This doesn't look like a Monarch transactions CSV. Missing columns: "+missing.join(", ")+". Headers found: "+p.headers.join(", "));
        return;
      }
      setParsed(p);
      setAnalysis(analyzeMonarchTransactions(p.rows));
    } catch(e){ setErr(e.message||String(e)); }
  }

  async function commit(){
    if (!parsed || busyRef.current) return;
    busyRef.current = true;
    setBusy(true); setErr(""); setResult(null);
    try {
      const r = await importMonarchTransactions(household.id, file.name, parsed.rows);
      setResult(r);
      await refresh();
    } catch(e){ setErr(e.message||String(e)); }
    finally{ busyRef.current = false; setBusy(false); }
  }

  async function applyExpenseBuckets(){
    if (!analysis || applyRef.current) return;
    applyRef.current = true;
    setApplyingExp(true); setApplyMsg("");
    try {
      await saveHousehold({...household,
        monthly_expenses_essential: Math.round(analysis.monthly.essential),
        monthly_expenses_discretionary: Math.round(analysis.monthly.discretionary),
        monthly_expenses_work_related: Math.round(analysis.monthly.work_related),
        monthly_expenses: 0,  // clear legacy
      });
      await refresh();
      setApplyMsg("✓ Household expense buckets updated from your imported transactions.");
    } catch(e){ setApplyMsg("✗ Update failed: "+(e.message||String(e))); }
    finally{ applyRef.current = false; setApplyingExp(false); }
  }

  async function deleteRun(runId){
    if (!confirm("Delete this import? It will remove all transactions imported in this run.")) return;
    await sb.from("transactions").delete().eq("import_run_id", runId);
    await sb.from("import_runs").delete().eq("id", runId);
    const {data} = await sb.from("import_runs").select("*").eq("household_id", household.id).order("created_at",{ascending:false}).limit(10);
    setRecent(data||[]);
  }

  return (
    <div className="space-y-4">
      <Card title="Import transactions from Monarch" right={<Pill tone="amber">CSV upload</Pill>}>
        <div className="text-sm text-slate-600 mb-3">
          In Monarch: <strong>Transactions → ⋯ menu → Export</strong>. Save the CSV anywhere, then drop it here. Schema expected: <code className="text-xs bg-slate-100 px-1 rounded">Date, Merchant, Category, Account, Original Statement, Notes, Amount, Tags, Owner</code>.
        </div>
        <div className="flex flex-wrap gap-3 items-center">
          <label className="cursor-pointer bg-red-600 hover:bg-red-700 text-white text-sm px-3 py-2 rounded font-medium">
            Choose CSV file
            <input type="file" accept=".csv,text/csv" className="hidden" onChange={e=>handleFile(e.target.files[0])}/>
          </label>
          {file && <span className="text-sm text-slate-600">{file.name} · {Math.round(file.size/1024)} KB</span>}
        </div>
        {err && <div className="mt-3 text-xs text-red-700 bg-red-50 border border-red-200 rounded px-3 py-2 whitespace-pre-wrap">{err}</div>}
      </Card>

      {analysis && (
        <Card title="Preview" right={<Pill tone="blue">{analysis.nRows.toLocaleString()} transactions</Pill>}>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <Stat label="Date range" value={`${analysis.minDate} → ${analysis.maxDate}`}/>
            <Stat label="Accounts found" value={String(analysis.accounts.length)}/>
            <Stat label="Categories" value={String(analysis.categories.length)}/>
            <Stat label="Last 12 mo" value={`${analysis.nRecent.toLocaleString()} txns`}/>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-3">
            <Stat label="Outflow (12 mo)" value={fmt$(analysis.totalOutflow12mo)} tone="warn"/>
            <Stat label="Inflow (12 mo)" value={fmt$(analysis.totalInflow12mo)} tone="good"/>
            <Stat label="Excl. transfers" value={fmt$(analysis.totalOutflow12mo - analysis.bucketAnnual.transfer)} sub="Real spend"/>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
            <div>
              <h4 className="text-sm font-semibold mb-2">Accounts found ({analysis.accounts.length})</h4>
              <ul className="text-xs space-y-1 max-h-48 overflow-y-auto bg-slate-50 rounded p-2">
                {analysis.accounts.map(([a,n])=> <li key={a} className="flex justify-between"><span className="truncate pr-2">{a}</span><span className="text-slate-500 shrink-0">{n} txn</span></li>)}
              </ul>
            </div>
            <div>
              <h4 className="text-sm font-semibold mb-2">Inferred monthly spend by bucket (last 12 mo)</h4>
              <table className="w-full text-sm">
                <tbody>
                  <tr className="border-b border-slate-100"><td className="py-1">Essential</td><td className="text-right font-medium">{fmt$(analysis.monthly.essential)}</td></tr>
                  <tr className="border-b border-slate-100"><td className="py-1">Discretionary</td><td className="text-right font-medium">{fmt$(analysis.monthly.discretionary)}</td></tr>
                  <tr className="border-b border-slate-100"><td className="py-1">Work-related</td><td className="text-right font-medium">{fmt$(analysis.monthly.work_related)}</td></tr>
                  <tr><td className="py-1">Uncategorized</td><td className="text-right text-slate-500">{fmt$(analysis.monthly.uncategorized)}</td></tr>
                </tbody>
              </table>
              <button onClick={applyExpenseBuckets} disabled={applyingExp} className="mt-2 w-full text-xs bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white px-3 py-1.5 rounded">
                {applyingExp ? <Spinner/> : "Apply to Household expense buckets"}
              </button>
              {applyMsg && <div className={"mt-1 text-[11px] rounded px-2 py-1 "+(applyMsg.startsWith("✓") ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-red-50 text-red-700 border border-red-200")}>{applyMsg}</div>}
              <div className="text-[10px] text-slate-500 mt-1">Uncategorized + transfers excluded from buckets. Edit individual categories on the Household tab.</div>
            </div>
          </div>

          <div className="mt-4">
            <h4 className="text-sm font-semibold mb-2">Top 30 outflow categories (last 12 mo)</h4>
            <div className="overflow-x-auto"><table className="w-full text-xs">
              <thead className="bg-slate-100 text-slate-600"><tr><th className="text-left px-2 py-1.5">Category</th><th className="text-left px-2 py-1.5">Bucket</th><th className="text-right px-2 py-1.5">Annual</th><th className="text-right px-2 py-1.5">Monthly</th></tr></thead>
              <tbody>
                {analysis.topOut.map((r,i)=>(
                  <tr key={i} className="border-t border-slate-100">
                    <td className="px-2 py-1">{r.category}</td>
                    <td className="px-2 py-1"><Pill tone={r.bucket==='essential'?'blue':r.bucket==='discretionary'?'amber':r.bucket==='work_related'?'red':r.bucket==='transfer'?'slate':'slate'}>{r.bucket}</Pill></td>
                    <td className="px-2 py-1 text-right">{fmt$(r.annual)}</td>
                    <td className="px-2 py-1 text-right">{fmt$(r.monthly)}</td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          </div>

          <div className="mt-4 flex gap-2">
            <button onClick={commit} disabled={busy} className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white text-sm px-4 py-2 rounded font-medium">
              {busy ? <Spinner/> : `Import ${analysis.nRows.toLocaleString()} transactions to Supabase`}
            </button>
            <button onClick={()=>{setFile(null);setParsed(null);setAnalysis(null);setResult(null);setErr("");}} className="text-sm text-slate-600 hover:text-slate-900 px-3 py-2">Cancel</button>
          </div>
          {result && <div className="mt-3 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-3 py-2">
            ✓ Imported {result.inserted.toLocaleString()} transactions. {result.skipped>0 && `Skipped ${result.skipped} (missing date or invalid).`} You can now ask the AI coach about your spending patterns.
          </div>}
        </Card>
      )}

      <Card title="Past imports">
        {recent.length===0 ? <div className="text-sm text-slate-500">No imports yet.</div> :
          <ul className="divide-y divide-slate-100">
            {recent.map(r=>(
              <li key={r.id} className="py-2 flex items-center justify-between text-sm gap-2 flex-wrap">
                <div>
                  <div className="font-medium">{r.filename||"(no filename)"} <Pill tone="slate">{r.source}</Pill></div>
                  <div className="text-xs text-slate-500">{r.rows_imported.toLocaleString()} imported · {r.date_range_start} → {r.date_range_end} · {new Date(r.created_at).toLocaleString("en-CA")}</div>
                </div>
                <button onClick={()=>deleteRun(r.id)} className="text-xs text-red-700 hover:underline">Delete run</button>
              </li>
            ))}
          </ul>
        }
      </Card>
    </div>
  );
}

// ==================== CASH FLOW (derived from imported transactions) ====================
function CashFlowPanel({state}){
  const {household} = state;
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [txns, setTxns] = useState([]);
  const [windowDays, setWindowDays] = useState(365);
  const [hideTransfers, setHideTransfers] = useState(true);
  const [hideIncome, setHideIncome] = useState(true);
  const [sortBy, setSortBy] = useState("annual");
  const [sortDir, setSortDir] = useState("desc");
  const [search, setSearch] = useState("");

  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      setLoading(true); setErr(""); setTxns([]);
      try {
        // Supabase REST has a server-side row cap (~1000). Paginate via .range.
        const PAGE = 1000; let from = 0; const all = [];
        for (;;) {
          const {data, error} = await sb.from("transactions")
            .select("date, category, amount, is_transfer")
            .eq("household_id", household.id)
            .order("date", {ascending:false})
            .range(from, from + PAGE - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          all.push(...data);
          if (data.length < PAGE) break;
          from += PAGE;
          if (from > 200000) break; // safety guard
        }
        if (!cancelled) setTxns(all);
      } catch(e){ if (!cancelled) setErr(e.message||String(e)); }
      finally { if (!cancelled) setLoading(false); }
    })();
    return ()=>{ cancelled = true; };
  }, [household.id]);

  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate() - windowDays);
  const startStr = start.toISOString().slice(0,10);
  const inWindow = txns.filter(t => t.date >= startStr);

  // Aggregate by category
  const byCat = new Map();
  for (const t of inWindow){
    const cat = t.category || "(uncategorized)";
    const entry = byCat.get(cat) || {category:cat, amount:0, count:0};
    entry.amount += Number(t.amount||0);
    entry.count += 1;
    byCat.set(cat, entry);
  }
  const periods = windowDays/30.44;
  const allRows = Array.from(byCat.values()).map(r=>{
    const bucket = bucketFor(r.category);
    // For income categories: net is positive (inflow). For spending: net is negative.
    // We display absolute amount with a "type" label.
    const isIncome = bucket==="income" || r.amount > 0;
    const annualEquivalent = -r.amount * (365/windowDays);   // flips sign — outflows positive
    return {
      category: r.category,
      bucket,
      isIncome,
      count: r.count,
      windowTotal: -r.amount,  // outflow positive, inflow negative
      monthly: -r.amount / periods,
      quarterly: -r.amount / periods * 3,
      annual: annualEquivalent,
    };
  });

  // Apply filters
  let rows = allRows;
  if (hideTransfers) rows = rows.filter(r => r.bucket !== "transfer");
  if (hideIncome) rows = rows.filter(r => r.bucket !== "income" && !r.isIncome);
  if (search) rows = rows.filter(r => r.category.toLowerCase().includes(search.toLowerCase()));
  // Sort
  rows.sort((a,b)=>{
    const av = a[sortBy], bv = b[sortBy];
    if (typeof av === "string") return sortDir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir==="asc" ? av-bv : bv-av;
  });

  // Bucket totals (annualized)
  const bucketTotals = {essential:0, discretionary:0, work_related:0, uncategorized:0, income:0, transfer:0};
  for (const r of allRows){
    if (r.bucket==="income") bucketTotals.income += Math.abs(r.annual);
    else bucketTotals[r.bucket] = (bucketTotals[r.bucket]||0) + r.annual;
  }

  function header(label, key, align="right"){
    const active = sortBy===key;
    return <th className={"px-2 py-1.5 cursor-pointer select-none "+ (align==="left"?"text-left":"text-right") + (active?" text-red-700":"") } onClick={()=>{
      if (sortBy===key) setSortDir(sortDir==="asc"?"desc":"asc");
      else { setSortBy(key); setSortDir(key==="category"?"asc":"desc"); }
    }}>{label}{active && <span className="ml-1">{sortDir==="asc"?"↑":"↓"}</span>}</th>;
  }
  function fmtRow(n){ return fmt$(Math.abs(n)); }
  function netColor(n, isIncome){
    if (isIncome) return "text-emerald-700";
    if (n < 0) return "text-emerald-700"; // negative outflow = net refund
    return "";
  }

  if (loading) return <Card title="Cash flow"><div className="text-sm text-slate-500"><Spinner/> Loading transactions…</div></Card>;
  if (err) return <Card title="Cash flow"><div className="text-sm text-red-700">{err}</div></Card>;
  if (txns.length === 0) return <Card title="Cash flow"><div className="text-sm text-slate-500">No transactions imported yet. Use the <strong>Import</strong> tab to upload your Monarch CSV.</div></Card>;

  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <Stat label="Transactions" value={txns.length.toLocaleString()} sub={`In window: ${inWindow.length.toLocaleString()}`}/>
        <Stat label="Essential (annual)" value={fmt$(bucketTotals.essential)} tone="default"/>
        <Stat label="Discretionary (annual)" value={fmt$(bucketTotals.discretionary)} tone="default"/>
        <Stat label="Income (annual)" value={fmt$(bucketTotals.income)} tone="good"/>
      </div>

      <Card title="Spending by category" right={
        <div className="flex flex-wrap gap-2 items-center text-xs">
          <SelectInput label="Window" value={String(windowDays)} onChange={v=>setWindowDays(Number(v))} options={[
            {value:"30", label:"Last 30 days"},
            {value:"90", label:"Last 90 days"},
            {value:"180", label:"Last 6 months"},
            {value:"365", label:"Last 12 months"},
            {value:"730", label:"Last 24 months"},
            {value:"99999", label:"All time"},
          ]}/>
        </div>
      }>
        <div className="flex flex-wrap gap-3 items-center mb-3 text-xs text-slate-600">
          <label className="flex items-center gap-1"><input type="checkbox" checked={hideTransfers} onChange={e=>setHideTransfers(e.target.checked)}/>Hide transfers</label>
          <label className="flex items-center gap-1"><input type="checkbox" checked={hideIncome} onChange={e=>setHideIncome(e.target.checked)}/>Hide income</label>
          <input type="text" placeholder="Search category…" value={search} onChange={e=>setSearch(e.target.value)} className="border border-slate-300 rounded px-2 py-1 text-xs"/>
          <span className="text-slate-400">{rows.length} categories shown</span>
        </div>

        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead className="bg-slate-100 text-slate-600 sticky top-0">
              <tr>
                {header("Category","category","left")}
                {header("Bucket","bucket","left")}
                {header("# txn","count")}
                {header(`Total (${windowDays===99999?"all":windowDays+"d"})`,"windowTotal")}
                {header("Monthly avg","monthly")}
                {header("Quarterly avg","quarterly")}
                {header("Annual equiv.","annual")}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i)=>(
                <tr key={i} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-2 py-1">{r.category}</td>
                  <td className="px-2 py-1"><Pill tone={r.bucket==='essential'?'blue':r.bucket==='discretionary'?'amber':r.bucket==='work_related'?'red':r.bucket==='income'?'green':'slate'}>{r.bucket}</Pill></td>
                  <td className="px-2 py-1 text-right text-slate-500">{r.count}</td>
                  <td className={"px-2 py-1 text-right "+netColor(r.windowTotal, r.isIncome)}>{fmtRow(r.windowTotal)}</td>
                  <td className={"px-2 py-1 text-right "+netColor(r.monthly, r.isIncome)}>{fmtRow(r.monthly)}</td>
                  <td className={"px-2 py-1 text-right "+netColor(r.quarterly, r.isIncome)}>{fmtRow(r.quarterly)}</td>
                  <td className={"px-2 py-1 text-right font-semibold "+netColor(r.annual, r.isIncome)}>{fmtRow(r.annual)}</td>
                </tr>
              ))}
            </tbody>
            {rows.length>1 && <tfoot className="bg-slate-50 font-semibold">
              <tr className="border-t-2 border-slate-300">
                <td className="px-2 py-1.5" colSpan={3}>Total ({rows.length} categories)</td>
                <td className="px-2 py-1.5 text-right">{fmt$(rows.reduce((s,r)=>s+r.windowTotal,0))}</td>
                <td className="px-2 py-1.5 text-right">{fmt$(rows.reduce((s,r)=>s+r.monthly,0))}</td>
                <td className="px-2 py-1.5 text-right">{fmt$(rows.reduce((s,r)=>s+r.quarterly,0))}</td>
                <td className="px-2 py-1.5 text-right">{fmt$(rows.reduce((s,r)=>s+r.annual,0))}</td>
              </tr>
            </tfoot>}
          </table>
        </div>
        <div className="text-[10px] text-slate-500 mt-3">
          <strong>How to read this:</strong> "Monthly avg" and "Quarterly avg" are computed by spreading the chosen window's total evenly. "Annual equivalent" projects the window's spend to a full year. Positive values are net outflows (spending); negative values mean net inflow (refunds or income exceeded charges). Bucket categorization is heuristic — same one used on the Import tab.
        </div>
      </Card>
    </div>
  );
}

function AICoach({state}){
  const [messages,setMessages]=useState([
    {role:"assistant", content:"Hi — I'm your educational Canadian financial coach. I see your household profile (province, ages, income, accounts, mortgages, retirement plan), so I can give you specific answers using your numbers. Try one of the suggested questions or ask anything about Canadian personal finance."}
  ]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const scrollRef=useRef(null);
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages,busy]);

  async function send(text){
    const content=(text??input).trim();
    if(!content||busy) return;
    setErr("");
    const next=[...messages,{role:"user",content}];
    setMessages(next); setInput(""); setBusy(true);
    try {
      // Only send user/assistant turns (skip the seed greeting since it's part of system tone)
      const apiMessages=next.filter((m,i)=> !(i===0 && m.role==="assistant"));
      const {data,error}=await sb.functions.invoke("coach-chat",{
        body:{ messages:apiMessages, max_tokens: 4096 },
      });
      if(error) throw new Error(error.message||String(error));
      if(data?.error) throw new Error(data.error+(data.detail?" — "+JSON.stringify(data.detail):""));
      setMessages(m=>[...m,{role:"assistant",content:data.reply||"(empty reply)", usage:data.usage, model:data.model, stop_reason:data.stop_reason}]);
    } catch(e){ setErr(e.message||String(e)); }
    finally{ setBusy(false); }
  }
  function continueLast(){ send("Please continue your previous answer from where it was cut off. Don't repeat what you already wrote."); }

  const suggestions=[
    "Given my profile, should I take CPP at 60, 65, or 70?",
    "What's the smartest withdrawal order for my accounts in retirement?",
    "How does the OAS clawback affect me?",
    "Should I prepay my mortgage or contribute more to my RRSP?",
    "Explain the widow's penalty and how to plan around it",
  ];

  return (
    <Card title="AI financial coach" right={<Pill tone="green">Live · Claude Sonnet 4.6</Pill>}>
      <div ref={scrollRef} className="h-80 overflow-y-auto bg-slate-50 rounded p-3 space-y-2 text-sm">
        {messages.map((m,i)=>{
          const truncated = m.stop_reason==="max_tokens";
          const isLast = i===messages.length-1 && m.role==="assistant";
          return (
            <div key={i} className={"flex "+(m.role==="user"?"justify-end":"justify-start")}>
              <div className={"max-w-[85%] rounded-lg px-3 py-2 whitespace-pre-wrap "+(m.role==="user"?"bg-red-600 text-white":"bg-white border border-slate-200")}>
                {m.content}
                {truncated && <div className="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1.5">
                  ⚠ Response was cut off at the token limit. {isLast && <button onClick={continueLast} disabled={busy} className="ml-1 underline font-medium hover:text-amber-900">Continue →</button>}
                </div>}
                {m.usage && <div className="text-[10px] mt-1 opacity-60 citation">Tokens in {m.usage.input_tokens} · out {m.usage.output_tokens}{m.stop_reason ? " · stop: "+m.stop_reason : ""}</div>}
              </div>
            </div>
          );
        })}
        {busy && <div className="flex justify-start"><div className="bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-500 flex items-center gap-2"><Spinner/> Coach is thinking…</div></div>}
      </div>
      {err && <div className="mt-2 text-xs text-red-700 bg-red-50 border border-red-200 rounded px-2 py-1.5">{err}</div>}
      <div className="mt-3 flex flex-wrap gap-2">
        {suggestions.map(s=> <button key={s} onClick={()=>send(s)} disabled={busy} className="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 disabled:opacity-50 rounded text-left">{s}</button>)}
      </div>
      <form onSubmit={e=>{e.preventDefault();send();}} className="mt-2 flex gap-2">
        <input value={input} onChange={e=>setInput(e.target.value)} disabled={busy}
          placeholder="Ask about RRSP, CPP, OAS, RRIF, mortgages, tax brackets…"
          className="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-red-500 focus:border-red-500 disabled:opacity-50"/>
        <button type="submit" disabled={busy||!input.trim()} className="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white px-4 py-2 rounded text-sm font-medium">{busy?<Spinner/>:"Send"}</button>
      </form>
      <div className="text-[10px] text-slate-400 mt-2">
        Your profile (province, ages, income, accounts, mortgages) is sent server-side to Anthropic so answers are personalized. Educational use only — not regulated financial advice.
      </div>
    </Card>
  );
}

function SourcesPanel(){
  const items=[["Canada Revenue Agency","https://www.canada.ca/en/revenue-agency.html"],["Service Canada","https://www.canada.ca/en/services/benefits.html"],["FCAC","https://www.canada.ca/en/financial-consumer-agency.html"],["StatsCan","https://www.statcan.gc.ca"],["OSFI","https://www.osfi-bsif.gc.ca"],["Canadian Securities Administrators","https://www.securities-administrators.ca"],["FSRA (Ontario pensions)","https://www.fsrao.ca"],["MPAC (Ontario assessment)","https://www.mpac.ca"]];
  return<Card title="Authoritative Canadian sources"><ul className="divide-y divide-slate-100">{items.map(([n,u])=><li key={u} className="py-1.5 flex justify-between gap-2 flex-wrap"><span className="text-sm">{n}</span><a href={u} target="_blank" rel="noreferrer" className="text-xs text-sky-700 underline">{u}</a></li>)}</ul></Card>;
}

// ==================== ROOT ====================
function AppShell({session}){
  const userId=session.user.id;
  const [state,setState]=useState(null);
  const [view,setView]=useState("dashboard");
  const [loadErr,setLoadErr]=useState("");
  const refresh=useCallback(async()=>{
    try{const s=await loadAll(userId); setState(s);}
    catch(e){setLoadErr(e.message||String(e));}
  },[userId]);
  useEffect(()=>{refresh();},[refresh]);

  const tabs=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"profile",icon:"👫",label:"Household"},
    {id:"accounts",icon:"💼",label:"Accounts"},
    {id:"mortgages",icon:"🏠",label:"Mortgages"},
    {id:"retire",icon:"🏖️",label:"Retirement"},
    {id:"tax",icon:"🧾",label:"Tax"},
    {id:"estate",icon:"📜",label:"Estate"},
    {id:"import",icon:"📥",label:"Import"},
    {id:"coach",icon:"💬",label:"Coach"},
    {id:"sources",icon:"📚",label:"Sources"},
  ];
  async function signOut(){await sb.auth.signOut();}

  if(loadErr)return<div className="p-8 text-sm text-red-700 bg-red-50 max-w-xl mx-auto mt-12 rounded">Load error: {loadErr}<br/><button onClick={refresh} className="mt-2 underline">Retry</button></div>;
  if(!state)return<div className="min-h-screen grid place-items-center"><Spinner/></div>;

  return(
    <div>
      <Disclaimer/>
      <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4 flex-wrap">
          <Brand/>
          <div className="flex items-center gap-3 text-xs">
            <span className="text-slate-500"><span className="pulse-dot inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1"></span>{session.user.email}</span>
            <button onClick={signOut} className="px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded">Sign out</button>
          </div>
        </div>
        <nav className="max-w-7xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto scroll-shadow">
          {tabs.map(t=><Tab key={t.id} {...t} active={view===t.id} onClick={()=>setView(t.id)}/>)}
        </nav>
      </header>
      <main className="max-w-7xl mx-auto p-4">
        {view==="dashboard"&&<Dashboard state={state} setView={setView}/>}
        {view==="profile"  &&<HouseholdPanel state={state} refresh={refresh}/>}
        {view==="accounts" &&<AccountsPanel state={state} refresh={refresh}/>}
        {view==="mortgages"&&<MortgagesPanel state={state} refresh={refresh}/>}
        {view==="retire"   &&<RetirementEngine state={state}/>}
        {view==="tax"      &&<TaxCentre state={state}/>}
        {view==="estate"   &&<EstatePanel state={state} refresh={refresh}/>}
        {view==="import"   &&<ImportPanel state={state} refresh={refresh}/>}
        {view==="coach"    &&<AICoach state={state}/>}
        {view==="sources"  &&<SourcesPanel/>}
      </main>
      <footer className="max-w-7xl mx-auto px-4 py-6 text-xs text-slate-500 border-t border-slate-200 mt-6">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div>Maple Plan • Educational planning support • {new Date().toLocaleDateString("en-CA")}</div>
          <div>Data effective Jan 2026 • Stored in Supabase ca-central-1</div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate>{session=><AppShell session={session}/>}</AuthGate>);
</script>
